/* ============================================================
   纵向追查链引擎
   一层一个人：问到要害 → 获得追查动作 → 执行 → 解锁下一层
   ============================================================ */

function curChain(){
  if(!CHAIN || S.chainStep<0 || S.chainStep>=CHAIN.length) return null;
  return CHAIN[S.chainStep];
}

/* 这个人现在是什么状态：target（该问）/ retired（问透了）/ locked（还没进视野） */
function chainOf(rid){
  if(!CHAIN) return null;
  const cur = curChain();
  if(cur && cur.who === rid) return "target";
  const idx = CHAIN.findIndex(c=>c.who===rid);
  if(idx < 0) return null;                 // 不在链上（如郑维），按自由人处理
  if(idx < S.chainStep) return "retired";  // 上几层的人，问透了
  return "locked";                         // 还没轮到
}

/* 判定追问是否抓到了本层要害 */
/* 链式命中判定
   设计：AI 负责演戏，不让它当裁判（它演得太好，从不认输）。
   判定权在前端，按"话里有多少实词"打分。

   ★ 举证是前置条件：
     这一层要求摊出的证据（c.need）没摊，他就会一路绕——
     问得再准也是"隔空喊话"，必须先把东西摆到桌上。 */
function checkChainHit(rid, q){
  const c = curChain();
  if(!c || S.chainReady) return null;
  if(rid !== c.who) return null;
  const t = String(q||"").trim();
  if(t.length < 2) return { hit:false, soft:false, vague:true, c };

  /* 泛问词：光有这些不算数。
     经验：玩家最容易脱口而出的就是这几种，必须明确告诉他"这么问没用"，
     否则他会一直换同义句反复试，十几轮都推进不了。 */
  const VAGUE = ["为什么","怎么回事","什么意思","有问题","奇怪","说说","怎么样","什么情况",
                 "解释","疑问","疑惑","不清楚","不明白","搞不懂","说一下","讲讲","你说说",
                 "到底","究竟","到底怎么回事","有毛病","不对劲"];
  const onlyVague = VAGUE.some(v => t.includes(v));

  /* ① 题眼：这一层必须问到的那件事 */
  const core = (c.words||[]).filter(w => w.length>=2 && t.includes(w));
  /* ② 边角：问到的人、事、物（有信息量但不是题眼）
        单字词（如"12"）容易误命中，这里只收 2 字以上 */
  const side = (c.soft||[]).filter(w => w.length>=2 && t.includes(w));

  /* ★ 前置检查：该摊的证据摊了吗 */
  const need = c.need || c.clue;
  const opened = rid ? (S.opened[rid] || []) : [];
  const hasEvidence = !need || opened.includes(need);

  /* 问到题眼 → 通过。哪怕句子里也带了泛问词 */
  if(core.length > 0){
    if(!hasEvidence){
      /* 问对了，但空口无凭——他不用认 */
      return { hit:false, noProof:true, need, core, side, c };
    }
    return { hit:true, hot:true, core, side, c };
  }

  /* 没题眼但有边角 → "挨着了"，给正反馈，不算落空。
     注意：noProof 只跟"题眼"绑定。边角/泛问这两类本来就问得不对，
     再叠一句"你有证据吗"会把玩家带到沟里去——他手里根本没这张牌。 */
  if(side.length > 0){
    return { hit:false, soft:true, side, need, c };
  }

  /* 只有泛问词 → 明确告诉他这么问没用 */
  if(onlyVague){
    return { hit:false, soft:false, vague:true, need, c };
  }

  return { hit:false, soft:false, need, c };
}

/* 抓到要害：本层问出来了，等玩家执行追查动作 */
function passChain(){
  const c = curChain();
  if(!c) return;
  S.chainReady = true;
  S.hintLevel = 0; S.stageMiss = 0;
  (c.give||[]).forEach(k=>{
    if(!S.unlockedClues.includes(k)) S.unlockedClues.push(k);
  });
  S.note = "";
  refreshParts();
}

/* 执行追查动作：推进到下一层；最后一层没有追查动作，直接收网 */
function doAction(){
  const c = curChain();
  if(!c) return;
  if(!S.chainReady) return;
  if(!S.chainDone.includes(S.chainStep)) S.chainDone.push(S.chainStep);
  // 上一层的人退场（留在名单上，但问不出东西了）
  S.retired[c.who] = true;
  const next = S.chainStep + 1;
  if(next >= CHAIN.length || !c.action){
    // 走到头 → 收网
    S.chainStep = CHAIN.length;
    S.stageBanner = `<div class="stage-banner final">
        <div class="sb-n">${esc(c.tag)} · 走到头了</div>
        <div class="sb-b">${esc(c.onPass)}<br><b>账、单、人，一条线全串上了——指认吧。</b></div>
      </div>`;
    S.note = "";
    setStep(3);
    return;
  }
  S.chainStep = next;
  const nc = CHAIN[next];
  if(!S.met) S.met = [];
  if(!S.met.includes(nc.who)) S.met.push(nc.who);
  if(!S.unlockedClues.includes(nc.clue)) S.unlockedClues.push(nc.clue);
  S.chainReady = false;
  S.stageMiss = 0; S.hintLevel = 0;
  S.stageBanner = `<div class="stage-banner">
      <div class="sb-n">${esc(c.actionDone||c.action)}</div>
      <div class="sb-b">${esc(c.toNext||"")}</div>
    </div>`;
  S.note = "";
  S.active = null;
  S.dialogText = "";
  S.dialogRole = null;
  render();
}

/* 落空时的渐进提示：只给关键词，很晚才给完整问法
   1-3 次：只确认"问对人了"
   4-6 次：给第一个关键词
   7-9 次：给两个关键词
   10+ 次：才给完整句子（纯保底，不自动通关） */
function chainMissHint(){
  const c = curChain();
  if(!c) return "";
  S.stageMiss++;
  const n = S.stageMiss;
  const ks = c.keys || [];

  /* 档位设计：玩家卡住两次就开始给方向，不让他空转。
     第一档只给"该往哪个方向问"（一句话），第二档给关键词，
     第三档才给完整问法——但完整问法也只是"这么问"，不是答案。 */
  if(n <= 1){
    return `<div class="hint-line dim">▍他知道点什么，但这话没戳到。</div>`;
  }
  if(n <= 3){
    S.hintLevel = 1;
    /* 用 tag 里的层级名给方向，不用关键词，保留思考空间 */
    return `<div class="hint-line kw">▍换个角度——别问「为什么」，问「谁」。</div>`;
  }
  if(n <= 6 && ks[0]){
    S.hintLevel = 2;
    return `<div class="hint-line kw strong">▍往这边想：<b>${esc(ks.join(" · "))}</b></div>`;
  }
  if(n >= 9 || !ks.length){
    S.hintLevel = 3;
    return `<div class="hint-line strong">▍实在想不出，就这么问：「${esc(c.hint3||"")}」</div>`;
  }
  S.hintLevel = 2;
  return `<div class="hint-line kw strong">▍往这边想：<b>${esc(ks.join(" · "))}</b></div>`;
}

/* 链式进度条 */
function renderChainBar(){
  if(!CHAIN) return "";
  const parts = CHAIN.map((c,i)=>{
    let cls = "cb-dot";
    if(i < S.chainStep) cls += " done";
    else if(i === S.chainStep) cls += " now";
    else cls += " wait";
    const nm = SUSPECTS[c.who].n;
    return `<span class="${cls}"><i></i><b>${esc(nm)}</b></span>`;
  }).join('<span class="cb-arrow">›</span>');
  return `<div class="chain-bar">
      <span class="cb-label">追查链</span>
      <div class="cb-track">${parts}<span class="cb-arrow">›</span>
        <span class="cb-dot ${S.chainStep>=CHAIN.length?"done":"wait"}"><i></i><b>收网</b></span>
      </div>
    </div>`;
}

/* 问透之后给点边角料：让他偶尔漏一句有用的 */
function retiredLine(rid){
  const pool = {
    LIN: ["那阵子沈总老下来，一天要问两回复审的进度。",
          "我后来想想，他关心的不是账对不对，是那笔钱「够不够数」。",
          "陈立走之前跟我说过一句：单据你自己看仔细点。我当时没懂。"],
    ZHOU: ["老实说，那批单子我签的时候，手是有点抖的。",
           "权限交接那天沈总亲自来的，平时这种事他不露面。",
           "我现在想想，他为什么非要我把复核权限留着不派给别人。"],
    ZHENG: ["那封邮件我发出去之后，等了一个多月，回复就一句话。",
            "我做审计的，最怕的不是有人做假，是没人让你查。"],
  }[rid];
  if(!pool || !pool.length) return "";
  return pool[(S.turns + rid.charCodeAt(0)) % pool.length];
}

/* 链外人员（不在追查链上）：也能聊，但只给旁证 */
function outsideLine(rid){
  const pool = {
    ZHENG: ["复审材料是我经手的，可研发费用那一栏，我从来没拿到过明细。",
            "我发那封邮件的时候，抄送了三个部门。回我的只有一个。",
            "你要问我账，我不懂。你要问流程该谁签字，我可以告诉你。"],
  }[rid];
  if(!pool || !pool.length) return "";
  return pool[(S.turns + rid.charCodeAt(0)) % pool.length];
}

/* 追问判定：看问得够不够狠。
   已摊证据 → 满额；还没摊证据（问话阶段）→ 减半，算是给玩家的正反馈。 */
function judgeProbe(rid, q){
  const opened = S.opened[rid] || [];

  const t = String(q||"");
  if(t.length < 6) return {score:0, tags:[], opened, bare:!opened.length};

  let score = 0, tags = [];

  // 1) 追问细节（时间/人物/数量/凭证）
  if(PROBE.detail.some(w=>t.includes(w))) { score += 2; tags.push("追问细节"); }
  // 2) 指出矛盾（最强手段）
  if(PROBE.clash.some(w=>t.includes(w))) { score += 3; tags.push("指出矛盾"); }
  // 3) 追问动机或来源
  if(PROBE.motive.some(w=>t.includes(w))) { score += 1; tags.push("追问动机"); }
  // 4) 打中这条证据的要害词（只在已摊证据时才可能）
  if(opened.some(k=>(CLUES[k].key||[]).some(w=>t.includes(w)))) { score += 3; tags.push("直击要害"); }
  // 5) 问题够长，说明是真在组织语言而不是甩一句
  if(t.length >= 16) { score += 1; tags.push("话术完整"); }

  // 空手问话（没摊证据）杀伤力减半——真正撕开防线还得靠证据
  const bare = !opened.length;
  if(bare) score = Math.round(score * 0.5);

  return {score, tags, opened, bare};
}

/* 取一条反应。返回 {t, act}，act 已按角色演法人格兜底 */
function pickReact(rid, tier, forceAct){
  /* 用当前案件的反应表：window.REACT_ALL 是启动时快照的第一案表，
     直接取它会把别的案件的人名对上第一案的反应。 */
  const r = (REACT || window.REACT_ALL || {})[rid];
  if(!r) return {t:"", act:"PLAIN"};
  const arr = tier==="low" ? r.low : r.high;
  if(!arr || !arr.length) return {t:"", act:"PLAIN"};
  const item = arr[Math.floor(Math.random()*arr.length)];
  const o = (typeof item === "string") ? {t:item} : item;
  const actor = (window.ACTOR || {})[rid] || {};
  let fallback = forceAct || (actor.byTier && actor.byTier[tier]) || "PLAIN";

  /* 同一个角色连着演两次同一个动作，玩家会腻。
     做法：排除上一次用过的动作，从剩下的里轮转。
     用独立的 actTick 计数（不能复用 S.turns，它会被别处改写）。 */
  if(!S.actSeen) S.actSeen = {};
  if(typeof S.actTick !== "number") S.actTick = 0;
  S.actTick++;

  let finalAct = o.act || fallback;
  const last = S.actSeen[rid];
  if(last === finalAct){
    const pool = ["PAUSE","SWALLOW","DEFLECT","OVERRUN","SILENCE"]
      .filter(a => a !== finalAct);
    /* 换一个不同的演法。若台本写死了动作，也允许被替换——观感优先 */
    finalAct = pool[S.actTick % pool.length];
  }
  S.actSeen[rid] = finalAct;
  S.dialogAct = finalAct;
  return { t:o.t, act:finalAct };
}

/* 表演提示行：「他怎么说的」——只在有内容时出现 */
function actTell(rid, act){
  const a = (window.ACT || {})[act];
  const actor = (window.ACTOR || {})[rid] || {};
  if(!a || act === "PLAIN" || act === "RUSH") return "";
  /* 同一角色每次说同一句话，提示语必须一致——否则玩家会当成新线索在解读 */
  const lines = {
    PAUSE:   `${SUSPECTS[rid].n}说这话之前，停了一下。`,
    SWALLOW: `他把半句话咽了回去。`,
    DEFLECT: `他没有回答，反而问了你一句。`,
    OVERRUN: actor.tell || `他忽然开始解释。`,
    SILENCE: `他没有马上接话。`,
  };
  return lines[act] || "";
}

function applyDefense(rid, delta){
  S.defense[rid]=Math.max(0,S.defense[rid]-delta);
  if(S.defense[rid]<=0 && !S.cracked[rid]){
    S.cracked[rid]=true;
    // 崩溃时覆盖为"松动"反应：用该角色的崩溃演法
    const actor = (window.ACTOR || {})[rid] || {};
    const r = pickReact(rid, "low", actor.broke);
    S.dialogText = r.t;
    S.dialogAct = r.act;
    S.dialogRole = rid;
    S.dialogTag = "防线崩溃";
    S.note += `<br><br><b style="color:var(--red)">▍${SUSPECTS[rid].n} 的防线崩溃了。</b> 他停下来，喝了一口水，然后说了句和之前不一样的话。`;
    S.noteKind="crack";
  }
}

function showCombo(n){
  const d=document.createElement("div");
  d.className="combo";
  d.textContent=`连击 ×${n}`;
  document.body.appendChild(d);
  setTimeout(()=>d.remove(),1400);
}

/* ============ 说话（真AI优先，模板兜底） ============ */
async function speakSuspect(rid, scene, opts){
  opts=opts||{};
  const s=SUSPECTS[rid];

  // 尝试真 AI
  if(S.useRealAI && BRIDGE.online){
    const payload={
      caseId: CURRENT_CASE ? CURRENT_CASE.id : "case1",
      roleId:rid, scene: scene==="evidence"?"defend":scene,
      playerInput: opts.clue ? `我拿出一份证据：${CLUES[opts.clue].b}` : (opts.question||""),
      history: S.chat.filter(c=>c.roleId===rid).slice(-8).map(c=>({text:c.text,isHuman:false})),
      revealedClues: S.unlockedClues,
      publicFacts: FACTS,
      detectiveRole: "神探张指导",
      deep: true,
      chainStage: CHAIN ? S.chainStep : -1,
      defense: S.defense[rid]
    };
    const r=await BRIDGE.ask(payload);
    updateCostHUD();
    if(r&&r.text){
      S.chat.push({roleId:rid,text:r.text,kind:scene});
      S.lastRecalled = r.recalled || 0;
      return {text:r.text, source:"llm", recalled:r.recalled, pushed:!!r.pushed};
    }
  }

  // 模板兜底
  let text;
  if(scene==="evidence" && opts.clue && s.defense[opts.clue]){
    const d=S.defense[rid];
    // 防线低时会露出真话
    if(d<=25 && opts.clue==="C2") text="……好吧。这个我确实知道。我当时就觉得有问题，但我没说。我说了又能怎么样？";
    else if(d<=25 && opts.clue==="C3") text="我不敢说。有人明确告诉过我，有些事别往外面讲。";
    else text=s.defense[opts.clue];
  } else if(scene==="evidence"){
    text="这条跟我没关系。你要问我别的我都可以答，这个我确实不知道。";
  } else {
    text=s.voice[Math.floor(Math.random()*s.voice.length)];
  }
  S.chat.push({roleId:rid,text,kind:scene});
  S.lastRecalled = 0;
  return {text, source:"template"};
}

async function askFree(){
  const el=$("freeInput");
  if(!el) return;
  const q=el.value.trim();
  if(!q){ toast("先打字再点追问"); return; }
  if(q.length>80){ alert("单次发言请控制在 80 字以内"); return; }
  const rid=S.active;
  if(!rid){ toast("先点上面的嫌疑人"); return; }
  el.value="";
  S.turns++;
  S.note="thinking";
  refreshParts();

  // 先判定这次追问的质量（基于已摊开的证据）
  const probe = judgeProbe(rid, q);

  let out;
  try{
    out = await speakSuspect(rid, "defend", {question:q});
  }catch(e){
    out = {text:""};
  }
  S.dialogText=""; S.dialogTag=""; S.dialogRole="";

  const t=String((out&&out.text)||"");
  if(!t){
    S.note = `<b style="color:var(--gold)">▍他没接上话</b> 服务暂时没响应（可能是网络或今日额度用完）。<span style="color:var(--fg3)">再点一次「追问」试试。</span>`;
    S.noteKind="mid";
    refreshParts();
    return;
  }
  const dodgy = /不知道|不清楚|无关|不好说|记不清|为什么要问|你问这个/.test(t) || t.length<12;

  // —— 链式判定（优先级最高）——
  /* 链式案件有自己的一套判定（checkChainHit），不用 judgeProbe。
     两套并存的后果：judgeProbe 给"陈立""签名"这种实体词打 1 分，
     于是 if(probe.score<1) 不成立，整段判定被跳过，玩家明明问对了却被告知"他绕开了"。
     所以这里一律以 checkChainHit 的结果为准。 */
  if(CHAIN){
    const c = curChain();
    const state = chainOf(rid);

    // ① 问到要害 → 本层问出来了，等玩家执行追查动作
    //    判定双通道：① AI 自报 [PUSHED]（AI 演得最准）② 关键词硬命中（保底、离线可用）
    const ch = checkChainHit(rid, q);
    const aiPushed = !!(out && out.pushed) && c && rid === c.who && !S.chainReady;
    if((ch && ch.hit) || aiPushed){
      S.hits++; S.combo++;
      if(S.combo>S.bestCombo) S.bestCombo=S.combo;
      const rr = pickReact(rid, "low");
      S.dialogText = rr.t; S.dialogAct = rr.act;
      S.dialogRole = rid;
      S.dialogTag = "被抓住了";
      applyDefense(rid, 20);
      S.note = `<b style="color:var(--red)">▍愣了一下，没能立刻接上。</b> <span style="color:var(--green)">-20</span><br>`
             + `<span style="color:var(--fg3)">${esc(c.onPass)} 现在，去查这件事。</span>`;
      S.noteKind = "crack";
      passChain();
      return;
    }

    // ② 问的是已问透的人 → 只回套话 + 偶尔给边角料，不推进
    if(state === "retired"){
      S.turns++;
      const side = retiredLine(rid);
      S.dialogText = t;
      S.dialogRole = rid;
      S.dialogTag = "已问透";
      S.note = `<b style="color:var(--gold)">▍他已经问透了</b> `
             + `该说的都说了，再追也不会多。<span style="color:var(--fg3)">现在要找的是 `
             + `<b style="color:${SUSPECTS[c.who].color}">${esc(SUSPECTS[c.who].n)}</b>。</span>`
             + (side ? `<div class="hint-line">▍他顺口提了一句：「${esc(side)}」</div>` : "");
      S.noteKind = "mid";
      refreshParts();
      return;
    }

    // ③ 问的是还没轮到的人 → 拦住
    if(state === "locked"){
      S.turns++;
      S.dialogText = t;
      S.dialogRole = rid;
      S.dialogTag = "还没到时候";
      S.note = `<b style="color:var(--fg3)">▍现在问他还太早</b> `
             + `你手上还没有能压住他的东西。先把 `
             + `<b style="color:${SUSPECTS[c.who].color}">${esc(SUSPECTS[c.who].n)}</b> 这条线追完。`;
      S.noteKind = "mid";
      refreshParts();
      return;
    }

    // ③b 链外的人（如郑维）：能聊、能套话，但不掉防线、不推进
    if(state === null){
      S.turns++;
      S.dialogText = t;
      S.dialogRole = rid;
      S.dialogTag = "旁观";
      const side = outsideLine(rid);
      S.note = `<b style="color:var(--fg3)">▍他不在这条线上</b> `
             + `他不在这条钱的链子上，问不出方向，但未必完全没用——`
             + (side ? `<div class="hint-line">▍他说：「${esc(side)}」</div>`
                     : `<span style="color:var(--fg3)">他摆摆手：「这个你得问经手的人。」</span>`);
      S.noteKind = "mid";
      refreshParts();
      return;
    }

    // ④ 本层要害已问出 → 提示去执行追查动作，不再判质量
    if(S.chainReady){
      S.dialogText = t;
      S.dialogRole = rid;
      S.dialogTag = "";
      S.note = `<b style="color:var(--green)">▍这条线问通了</b> 点下面的「${esc(c.action||"继续")}」，往下追一层。`;
      S.noteKind = "hit";
      refreshParts();
      return;
    }

    // ⑤ 本层对象但没问到要害 → 四种反馈，全按 checkChainHit 的结果给
    /* 注意这里不再看 probe.score：那是给分幕案件用的评分器。
       链式案件里它只会捣乱——一提到人名、签名它就给分，
       反而把判定的主动权从 checkChainHit 手里抢走了。 */
    {
      S.misses++; S.combo=0;
      chainMissHint();

      /* 软命中：玩家问的东西是对的，只是没问透。
         这种情况绝不能给"落空"的反馈——那会让玩家以为自己走错方向了。
         判定顺序：先看有没有问到题眼（noProof），再看边角，最后才是泛问。 */
      if(ch && ch.noProof && ch.core && ch.core.length){
        /* 问到了题眼，但证据没摆上桌。
           这是"隔空喊话"——他不是不会答，是没必要答。
           措辞保持中性：四个角色里有男有女，不能用"他"。 */
        const nk = ch.need;
        const nt = (nk && CLUES[nk]) ? CLUES[nk].t : "";
        S.note = `<b style="color:var(--gold)">▍你问对了——但空口无凭</b> `
               + `<span style="color:var(--fg3)">一句"你有证据吗"就把你顶回来了。`
               + (nt ? `先把 <b style="color:var(--gold)">「${esc(nt)}」</b> 摆到面前，再问这句话。`
                     : `先在下面挑一张证据摆上来。`)
               + `</span>`;
        S.noteKind = "soft";
      } else if(ch && ch.soft){
        S.note = `<b style="color:var(--gold)">▍快挨着了</b> `
               + `<span style="color:var(--fg3)">你问的是对的方向，但他还没被逼到。换个角度，往下压一层。</span>`;
        S.noteKind = "soft";
      } else if(ch && ch.vague){
        S.note = `<b style="color:var(--fg3)">▍太泛了</b> `
               + `<span style="color:var(--fg3)">"为什么""怎么回事"这种问法，谁都能绕过去。要问具体的：哪一笔、谁说的、什么时候。</span>`;
        S.noteKind = "vague";
      } else {
        S.note = dodgy
          ? `<b>▍绕开了</b> 这不是个能让人难受的问题。`
          : `<b>▍不痛不痒</b> 答得挺顺。`;
        S.noteKind = "miss";
      }
      refreshParts();
      return;
    }
  }

  // —— 分幕判定（旧案件）——
  //    CHAIN 案件在上面已经把所有情况 return 掉了，走不到这里。
  //    加这层保险是为了防止日后改动时意外穿透——穿透的后果是拿分幕规则
  //    去扣链式案件的防线，玩家会以为自己推进了，其实一点没动。
  if(CHAIN){ refreshParts(); return; }

  const sh = checkStageHit(rid, q);
  if(sh && sh.hit){
    S.hits++; S.combo++;
    if(S.combo>S.bestCombo) S.bestCombo=S.combo;
    const rr = pickReact(rid, "low");
    S.dialogText = rr.t; S.dialogAct = rr.act;
    S.dialogRole = rid;
    S.dialogTag = "被抓住了";
    applyDefense(rid, 20);
    S.note = `<b style="color:var(--red)">▍他愣了一下，没能立刻接上。</b> <span style="color:var(--green)">-20</span><br><span style="color:var(--fg3)">你抓住的是：${esc(sh.task.ask)}</span>`;
    S.noteKind = "crack";
    passStage();
    return;
  }

  if(!probe || probe.score < 1){
    // 问了句废话（或者太短没接住）
    S.misses++; S.combo=0;
    // 分幕案件：连续落空时累计提示档位（提示显示在上方「本幕目标」里）
    if(curStage() && curStage().task) stageMissHint();
    S.note = dodgy
      ? `<b>▍他绕开了</b> 这不是个能让他难受的问题。`
      : `<b>▍不痛不痒</b> 他答得挺顺。`;
    S.noteKind = "miss";
    refreshParts();
    return;
  }

  // 命中：按追问质量扣防线
  const s = probe.score;
  let delta, kind, label;
  if(s >= 7){ delta=30; kind="crack"; label=`<b>▍问到了要命的地方</b>`; }
  else if(s >= 5){ delta=20; kind="crack"; label=`<b>▍他停顿了一下，想改口</b>`; }
  else if(s >= 3){ delta=12; kind="hit"; label=`<b>▍他答得没刚才顺了</b>`; }
  else { delta=5; kind="mid"; label=`<b>▍他挡回去了，但你摸到了边</b>`; }

  if(probe.bare){
    label += `<br><span style="color:var(--fg3);font-size:11.5px">（还没摊证据，这一问杀伤力只有一半。想知道他到底怕什么，去举证阶段把线索摆出来。）</span>`;
  }

  S.hits++; S.combo++;
  if(S.combo>S.bestCombo) S.bestCombo=S.combo;
  const rr = pickReact(rid, s>=3 ? "low" : "high");
  S.dialogText = rr.t; S.dialogAct = rr.act;
  S.dialogRole = rid;
  S.dialogTag = s>=3 ? "被问住了" : "被追问";
  applyDefense(rid, delta);

  S.note = `${label} <span style="color:var(--green)">-${delta}</span><br><span style="color:var(--fg3)">${probe.tags.join(" · ")}｜正压着「${probe.opened.map(k=>CLUES[k].t).join("、")}」</span>`;
  S.noteKind = kind;

  if(S.combo>=2) showCombo(S.combo);
  refreshParts();
}

/* ============ 选项模式：可控问话（每层四选一） ============
   与自由输入模式并存：只要案件的 CHAIN 第一层带 opts，就走这里。
   选错不推进、可以接着问；只有命中要害（keyDone）才解锁下一步。 */

function choiceOn(){
  return !!(CHAIN && CHAIN[0] && CHAIN[0].opts && CHAIN[0].opts.length);
}

/* ===== 演出层：抉择倒计时 =====
   选项一出现就开始走表。超时不算选错，只是他等着、你迟疑了——
   给一次提示，然后把时限收紧一点，逼你下一句必须开口。 */
let chTimer = null;

function chTimerStop(){
  if(chTimer !== null){ clearInterval(chTimer); chTimer = null; }
}

function chTimerStart(){
  chTimerStop();
  const ch = S.ch;
  if(!ch || ch.keyDone || ch.pick >= 0 || ch.actDone) return;
  if(!curSite() || !S.sv || !S.sv.done) return;
  const fill = document.getElementById("chTimerFill");
  const txt  = document.getElementById("chTimerTxt");
  const bar  = document.getElementById("chTimerBar");
  if(!fill || !txt) return;
  if(!ch.tStart) ch.tStart = Date.now();
  const tick = function(){
    const left = ch.tLimit - (Date.now() - ch.tStart) / 1000;
    const k = Math.max(0, left) / ch.tLimit;
    fill.style.width = (k * 100) + "%";
    txt.textContent = Math.max(0, Math.ceil(left)) + "s";
    const hot = k <= 0.34;
    const sec = Math.max(0, Math.ceil(left));
    if(ch._tickSec !== sec){ ch._tickSec = sec; if(sec > 0) FX.tick(hot); }
    if(bar){
      bar.className = "ch-tbar" + (hot ? " hot" : "");
      const wrap = bar.parentNode;
      const head = wrap && wrap.querySelector ? wrap.querySelector(".ch-timer") : null;
      if(head) head.className = "ch-timer" + (hot ? " hot" : "");
    }
    if(left <= 0){ chTimerStop(); chTimeout(); }
  };
  tick();
  chTimer = setInterval(tick, 200);
}

function chTimeout(){
  const ch = S.ch;
  if(!ch || ch.keyDone || ch.pick >= 0) return;
  ch.tOut = (ch.tOut || 0) + 1;
  ch.tLimit = Math.max(14, ch.tLimit - 4);
  ch.tStart = Date.now();
  ch.timeoutMsg = true;
  ch.hint = true;
  FX.warn();
  FX.float("他没等你 · 你错过了开口的时机", "var(--red)");
  render();
}

/* ============ 三拍审讯 ============
   第一拍 摊证据：从弹药库挑一条摊到桌上（摊错 = 对方化解 + 警戒 +12）
   第二拍 抓破绽：把对方的说辞拆成几段，点出站不住的那一句（点错 = 被带偏 + 警戒 +10）
   第三拍 追问　：原来的四选一（问错 = 警戒 +15）
   警戒满 100 → 对方请律师，本层失手通过，收网降档。不卡死。 */

/* 每层现场能翻出的「掩护线索」（正解由 CHAIN[i].clue 自动绑到关键件上）。
   掩护线索看起来都跟本案有关，但摊到这个人面前不起作用。 */
const ARM_COVER = {
  case1: [["C3","C6"], ["C6","C1"], ["C4","C5"], ["C1","C6"]],
  case2: [["C5","C4"], ["C1","C8"], ["C8","C1"], ["C3","C5"]],
  case3: [["C3","C6"], ["C8","C1"], ["C8","C4"], ["C8","C4"]],
  case4: [["C3","C8"], ["C1","C5"], ["C2","C7"], ["C5","C2"]],
  case5: [["C3","C8"], ["C5","C4"], ["C2","C7"], ["C6","C8"]],
  case6: [["C3","C5"], ["C4","C5"], ["C7","C2"], ["C6","C4"]],
};

const ALARM_EV = 12;   // 摊错一条证据
const ALARM_CK = 10;   // 指错一句破绽
const ALARM_QK = 15;   // 问错一次

/* 本层：物件索引 → 线索 ID */
function layerArmor(){
  const c = curChain(), site = curSite();
  if(!c || !site || !site.items || !c.clue) return {};
  const cid = (CURRENT_CASE && CURRENT_CASE.id) || "case1";
  const cover = (ARM_COVER[cid] && ARM_COVER[cid][S.chainStep]) || [];
  const keyIdx = site.items.findIndex(function(o){ return o.key; });
  const others = site.items.map(function(_, i){ return i; }).filter(function(i){ return i !== keyIdx; });
  const map = {};
  if(keyIdx >= 0) map[keyIdx] = c.clue;
  others.slice(0, cover.length).forEach(function(idx, k){ map[idx] = cover[k]; });
  return map;
}

function armAdd(id){
  if(!id || !S.armory || S.armory.indexOf(id) >= 0) return;
  S.armory.push(id);
}

function alarmAdd(n){
  if(!S) return;
  const prev = S.alarm || 0;
  S.alarm = Math.max(0, Math.min(100, prev + n));
  if(S.alarm > (S.alarmPeak || 0)) S.alarmPeak = S.alarm;
  /* 警戒跨过 60 / 100 两道线时给一次听觉提醒（对方状态的质变） */
  if(n > 0 && prev < 60 && S.alarm >= 60){ FX.warn(); FX.float("对方开始防着你了", "var(--red)"); }
  if(n > 0 && prev < 100 && S.alarm >= 100){ FX.warn(); }
  /* 警戒破 80：张指导不再旁观，会主动递一次台阶。
     记一次「介入」——收网评级据此降一档（这是他插手的代价）。 */
  if(S.alarm >= 80 && !S.dirFired){ S.dirFired = true; S.directorN = (S.directorN || 0) + 1; }
}

function alarmBar(){
  const a = Math.max(0, Math.min(100, S.alarm || 0));
  const hot = a >= 60;
  const word = a >= 100 ? "彻底起疑" : (a >= 60 ? "明显警惕" : (a >= 25 ? "略有防备" : "还放松着"));
  return `<div class="alarm-wrap${hot ? " hot" : ""}">
      <span>对方状态 · ${word}</span>
      <div class="alarm-bar"><i style="width:${a}%"></i></div>
      <b>${a}</b>
    </div>`;
}

/* 说辞拆段：按句读切，太短的并回去 */
function segsOf(t){
  const raw = String(t || "").split(/[。！？；，、]/).map(function(s){ return s.trim(); }).filter(function(s){ return s.length > 0; });
  const out = [];
  raw.forEach(function(s){
    if(s.length < 3 && out.length){
      out[out.length - 1] += "，" + s;
    } else out.push(s);
  });
  return out;
}

/* 破绽在哪一段：先找 weak 里引号包住的原文，退而求其次按用字重合度打分 */
function weakSegOf(t, weak){
  const segs = segsOf(t);
  if(segs.length <= 1) return 0;
  const head = String(weak || "").split(/——|—|--/)[0];
  const q = head.match(/[『「“]([^』」”]{2,})[』」”]/);
  if(q){
    const hit = segs.findIndex(function(s){ return s.indexOf(q[1]) >= 0 || q[1].indexOf(s) >= 0; });
    if(hit >= 0) return hit;
  }
  const cjk = function(s){ return new Set(String(s).replace(/[^\u4e00-\u9fa5]/g, "")); };
  const wc = cjk(head);
  let best = 0, bestScore = -1;
  segs.forEach(function(s, i){
    const sc = cjk(s);
    let hit = 0;
    sc.forEach(function(ch){ if(wc.has(ch)) hit++; });
    const score = hit / Math.max(1, sc.size);
    if(score > bestScore){ bestScore = score; best = i; }
  });
  return best;
}

/* 摊错时对方的化解语：优先用他针对这条线索的既有说法，没有就给一句通用挡回 */
function evadeLine(rid, clueId){
  const pl = PLEA && PLEA[rid];
  const hit = pl && pl[clueId] && pl[clueId].t;
  if(hit) return hit;
  const bank = [
    "他扫了一眼，把纸推了回来：「这跟我这边对不上。」",
    "他没接那张纸，手在桌上敲了两下：「我要说的都说了。」",
    "「这条你得去问别人。」他把话题截断了。",
  ];
  let h = 0;
  for(let i = 0; i < String(clueId).length; i++) h = (h * 31 + String(clueId).charCodeAt(i)) % 997;
  return bank[h % bank.length];
}

/* keepSv = true：保留现场勘察的进度（复活重来时用，不逼玩家再翻一遍现场） */
function chReset(keepSv){
  const sv = keepSv ? (S && S.sv) : null;
  S.ch = { pick:-1, picked:[], wrongN:0, wrong:0, keyDone:false, hint:false, actDone:false,
           tStart:0, tLimit:30, tOut:0, timeoutMsg:false,
           phase:"evidence", evPick:null, evDead:[], evReply:"", evWrongN:0, force:false,
           crackAt:-1, crackPick:-1, crackNo:[],
           readDone:false, readPick:-1, readNo:[],
           scoldUsed:[], scoldDone:false, scoldTry:-1, scoldOk:false,
           scoldName:"", scoldSay:"", scoldBack:"", scoldWhy:"" };
  if(sv) S.sv = sv; else svReset();
}

/* ============ 现场勘察（每层第一步） ============
   进层先给一个现场，桌上摊着一堆东西，玩家一件一件点开。
   其中只有一件「对不上」（key:true）——翻到它，才解锁问话。 */

function curSite(){
  return (SITE && S.chainStep >= 0) ? (SITE[S.chainStep] || null) : null;
}

/* 每次进层重洗一遍展示顺序：光点与索引条都不再是「关键件永远排第一」。
   只洗「看到的先后」，不动物件本身的坐标与 key 判定。 */
function svShuffle(n){
  const a = [];
  for(let i=0;i<n;i++) a.push(i);
  for(let i=n-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

/* 记住每层上一次的洗牌结果：不让「关键那件」连着两次落在同一位置，
   否则玩家重开时会觉得「根本没随机」。 */
const _svLast = {};

function svReset(){
  const site = curSite();
  if(!site || !site.items){
    S.sv = { opened:[], cur:-1, keyDone:false, hint:false, done:false, order:[] };
    return;
  }
  const n = site.items.length;
  const keyIdx = site.items.findIndex(function(o){ return o.key; });
  const tag = ((CURRENT_CASE && CURRENT_CASE.id) || "?") + "-" + S.chainStep;
  const prev = _svLast[tag];
  let order = svShuffle(n);
  for(let t=0; t<8 && prev; t++){
    if(order.indexOf(keyIdx) !== prev.keyPos && order.join(",") !== prev.order) break;
    order = svShuffle(n);
  }
  _svLast[tag] = { order: order.join(","), keyPos: order.indexOf(keyIdx) };
  S.sv = { opened:[], cur:-1, keyDone:false, hint:false, done:false, order };
}

function svOpen(i){
  const site = curSite(); if(!site) return;
  const it = site.items[i]; if(!it) return;
  const sv = S.sv;
  sv.cur = i;
  const fresh = sv.opened.indexOf(i) < 0;
  if(fresh){
    sv.opened.push(i);
    const am = layerArmor();          // 这件东西本身就是一条线索 → 入弹药库
    if(am[i]) armAdd(am[i]);
  }
  if(it.key) sv.keyDone = true;
  if(!sv.keyDone && sv.opened.length >= 3) sv.hint = true;
  if(fresh){
    if(it.key){ FX.grid(); FX.float("关键的那件 · 到手", "var(--gold)"); }
    else FX.soft();
  }
  render();
}

function svGo(){
  if(!curSite() || !S.sv.keyDone) return;
  S.sv.done = true;
  FX.nav();
  render();
}

function renderProbe(){
  chTimerStop();
  const site = curSite(); if(!site) return renderChoice();
  const c = curChain(), sv = S.sv, N = (CHAIN && CHAIN.length) || 1;
  stage.className = "evidence";

  const pct = Math.round(S.chainStep / N * 100);
  hudStep.textContent = "现场勘察";
  hudFill.style.width = pct + "%";

  const head = `
    <div class="ch-head">
      <div class="ch-row">

      </div>
      <div class="ch-track"><i style="width:${pct}%"></i></div>
      ${alarmBar()}
    </div>`;

  /* 展示顺序（每次进层重洗）—— 光点与索引条都按它排 */
  const ord = (sv.order && sv.order.length === site.items.length)
    ? sv.order
    : site.items.map(function(_, i){ return i; });

  const spots = ord.map(function(i){
    const o = site.items[i];
    const seen = sv.opened.indexOf(i) >= 0;
    const cls = "sv-spot" + (seen ? " seen" : "") + (seen && o.key ? " hit" : "")
      + (sv.cur === i ? " now" : "");
    const d = (Math.random() * 2.2).toFixed(2);
    return `<button class="${cls}" style="left:${o.x}%;top:${o.y}%" onclick="svOpen(${i})" aria-label="${esc(o.n)}"><i style="animation-delay:${d}s"></i><b>${esc(o.n)}</b></button>`;
  }).join("");

  const scene = `
    <div class="sv-stage">
      <div class="sv-frame">
        <img src="${site.img}" alt="${esc(site.place)}">

      </div>
    </div>`;

  const lead = `

      <span>▸ ${esc(site.place)} &nbsp;·&nbsp; ${esc(site.time)}</span>

    </div>`;

  const list = `<div class="sv-list">${
    ord.map(function(i){
      const o = site.items[i];
      const seen = sv.opened.indexOf(i) >= 0;
      const cls = "sv-chip" + (seen ? (o.key ? " hit" : " seen") : "");
      return `<button class="${cls}" onclick="svOpen(${i})">${esc(o.n)}</button>`;
    }).join("")
  }</div>`;

  let body = "";
  if(sv.cur < 0){
    body = `<div class="sv-body">
        <div class="mentor"><b>张指导：</b>${site.hint || "先看现场，再找人。"}</div>
        <div class="sv-read" style="margin-top:10px">${site.desc}</div>
      </div>`;
  } else {
    const o = site.items[sv.cur];
    body = `<div class="sv-body${o.key ? " hit" : ""}">
        <div class="sv-h"><span class="sv-tag ${o.key ? "key" : "nor"}">${o.key ? "关键疑点" : "线索"}</span><b>${esc(o.n)}</b></div>
        ${o.react ? `<div class="sv-react">${o.react}</div>` : ""}
        <div class="sv-read">${o.read}</div>
        ${o.flag ? `<div class="sv-flag">${o.flag}</div>` : ""}
        ${o.tip ? `<div class="mentor" style="margin-top:10px"><b>张指导：</b>${o.tip}</div>` : ""}
        ${o.gain ? `<div class="sv-gain">已记入线索 · ${esc(o.gain)}</div>` : ""}
      </div>`;
  }

  let tail = "";
  if(sv.keyDone){
    const who = site.goTo || (c && SUSPECTS && SUSPECTS[c.who] ? SUSPECTS[c.who].n : "当事人");
    tail = `<div class="sv-done">${site.done}
        <div><button class="btn primary" onclick="svGo()">去找 ${esc(who)} 谈</button></div>
      </div>`;
  } else if(sv.hint){
    tail = `<div class="ch-hint"><b>张指导：</b>东西翻得差不多了，但还没找到「对不上」的那一件。往回看——哪两样东西本该一致，却对不上？</div>`;
  } else if(sv.cur >= 0){
    tail = `<div class="ch-hint"><b>张指导：</b>画面上还有亮着的光点。线索是一点点拼出来的，别指望第一件就是答案。</div>`;
  }

  stage.innerHTML = head + scene + lead + list + body + tail;
}

/* 警戒触顶：对方请律师，本层失手通过（流程继续，收网降档） */
function forcePass(why){
  const ch = S.ch;
  ch.force = true;
  ch.forceWhy = why || "alarm";
  ch.keyDone = true;
  ch.phase = "done";
  ch.evPick = null;
  S.forceN = (S.forceN || 0) + 1;
  FX.over();
  FX.shake(true);
  FX.flash("rgba(229,72,77,.30)");
  render();
}

/* ============ 收网评级 ============
   S 全对 / A 偶然失手 / B 多次绕路 / C 让对方请了律师 */
const GRADE_DESC = {
  S:{ g:"S", name:"一击到底", tone:"green",
      line:"一次都没绕。证据一条条摆上去，破绽一句句点出来——他到最后才明白，你没打算给他留退路。" },
  A:{ g:"A", name:"干净落案", tone:"green",
      line:"链路干净。中间绕了一两下，但方向始终没偏——他没找到能站住的台阶，最后只能坐回椅子里。" },
  B:{ g:"B", name:"勉强坐实", tone:"gold",
      line:"指控立住了，但你是绕着走到这儿的。他知道自己没被彻底看穿——所以到最后，他也没真正认。" },
  C:{ g:"C", name:"被动收场", tone:"red",
      line:"人是揪出来了，可那张椅子上的人从头到尾没慌过。有一部分账，最后没能算到该算的人头上。" }
};

function gradeOf(){
  const miss = S.misses || 0, peak = S.alarmPeak || 0, forced = S.forceN || 0;
  const dir = S.directorN || 0;

  let g;
  if(forced > 0 || miss >= 8 || peak >= 100) g = "C";
  else if(miss >= 4 || peak >= 60) g = "B";
  else if(miss >= 1) g = "A";
  else g = "S";

  /* 张指导代你稳了一手 → 这一局的成绩不完全是你的，降一档 */
  const ORDER = ["S", "A", "B", "C"];
  if(dir > 0) g = ORDER[Math.min(ORDER.indexOf(g) + dir, ORDER.length - 1)];

  const d = Object.assign({}, GRADE_DESC[g]);
  d.raw = g; d.capped = false;

  const tips = [];
  tips.push("累计失误 " + miss + " 次");
  if(S.scolds) tips.push("旧账钉死 " + S.scolds + " 次");
  if(forced) tips.push("律师到场 " + forced + " 次");
  if(dir) tips.push("张指导替你稳了 " + dir + " 次（降 " + dir + " 档）");
  d.tip = tips.join(" · ");

  return d;
}

function gradeCard(){
  const r = gradeOf();
  const col = r.tone === "red" ? "var(--red)" : (r.tone === "gold" ? "var(--gold)" : "var(--green)");
  const bg  = r.tone === "red" ? "rgba(229,72,77,.08)" : (r.tone === "gold" ? "rgba(232,179,57,.08)" : "rgba(63,185,80,.08)");
  const bd  = r.tone === "red" ? "rgba(229,72,77,.4)" : (r.tone === "gold" ? "rgba(232,179,57,.4)" : "rgba(63,185,80,.4)");
  return `
    <div class="grade" style="border-color:${bd};background:${bg}">
      <div class="grade-letter" style="color:${col}">${r.g}</div>
      <div class="grade-body">
        <div class="grade-name" style="color:${col}">${r.name}</div>
        <div class="grade-line">${r.line}</div>
        <div class="grade-meta">
          失误 ${S.misses || 0} 次 &nbsp;·&nbsp; 警戒峰值 ${S.alarmPeak || 0}
          ${S.forceN ? ` &nbsp;·&nbsp; 律师到场 ${S.forceN} 次` : ""}
          ${S.scolds ? ` &nbsp;·&nbsp; <span style="color:var(--gold)">旧账钉死 ${S.scolds} 次</span>` : ""}

        </div>
        <div class="grade-tip">${r.tip}</div>
      </div>
    </div>`;
}

function gradeMini(){
  const r = gradeOf();
  const col = r.tone === "red" ? "var(--red)" : (r.tone === "gold" ? "var(--gold)" : "var(--green)");
  return `<div class="grade-mini">

      <span style="color:${col}">${r.name}</span>
      <span style="margin-left:auto;color:var(--fg3)">失误 ${S.misses || 0} · 警戒峰值 ${S.alarmPeak || 0}${
        S.forceN ? " · 律师到场 " + S.forceN + " 次" : ""}</span>
    </div>`;
}

/* ============ 第一拍 · 摊证据 ============ */
/* 翻错也产出信息（《环中物语》的「错牌归位」思路）：
   这条线索不是没用，是「对他没用」——方向错了，别再试。 */
function clueIsFor(id, who){
  if(!CHAIN) return "";
  for(let j = 0; j < CHAIN.length; j++){
    if(CHAIN[j].need === id){
      if(CHAIN[j].who === who) return "";
      return "这条线索不是冲他来的——它是另一个人的要害。先收着，别在这儿磨。";
    }
  }
  return "他早备好了这套说法。这条线索压不动他。";
}

function renderEvidence(){
  chTimerStop();
  const c = curChain(); if(!c){ setStep(3); return; }
  const ch = S.ch, sp = SUSPECTS[c.who], N = CHAIN.length;
  S.active = c.who;
  stage.className = "evidence" + (curArt() ? " arton" : "");

  const pct = Math.round(S.chainStep / N * 100);
  hudStep.textContent = "问话 · 摊证据";
  hudFill.style.width = pct + "%";

  const head = `
    <div class="ch-head">
      <div class="ch-row">
        <span class="ch-n">第 <b>${S.chainStep+1}</b> / ${N} 层</span>
        <span class="ch-tag">${esc(c.tag)}</span>
        <span class="ch-wrong" style="color:var(--gold);background:rgba(232,179,57,.1);border-color:rgba(232,179,57,.32)">第一拍 · 摊证据</span>
      </div>
      <div class="ch-track"><i style="width:${pct}%"></i></div>
      ${alarmBar()}
    </div>`;

  const pool  = (S.armory || []).filter(function(id){ return CLUES[id]; });
  let   alive = pool.filter(function(id){ return ch.evDead.indexOf(id) < 0; });
  /* 手上的东西全被挡回来时，允许把先前挡回的再摆一遍——
     不这么做就会走进死局，而惩罚已经由「本层失误满 3 次」兜住了。 */
  if(!alive.length && pool.length){
    ch.evDead = [];
    ch.evRefill = true;
    alive = pool.slice();
  }

  const grid = alive.length
    ? `<div class="arm-grid">${alive.map(function(id){
        const cl = CLUES[id];
        return `<button class="arm-item${ch.evPick === id ? " sel" : ""}" onclick="evPickArm('${id}')">
            <span class="arm-t">${esc(cl.t)}</span>
            <span class="arm-b">${esc(cl.b)}</span>
          </button>`;
      }).join("")}</div>`
    : `<div class="ch-hint"><b>张指导：</b>手上能摆的东西全被挡回来了。回头看现场——是不是还有没翻开的。</div>`;

  const deads = ch.evDead.length
    ? `<div class="bx-sub" style="margin-top:10px">已排除（他备过说法的）：${
        ch.evDead.map(function(id){ return esc(CLUES[id] ? CLUES[id].t : id); }).join("、")}</div>`
    : (ch.evRefill && pool.length
        ? `<div class="bx-sub" style="margin-top:10px">这些他全挡回来了。张指导让你换个说法——把先前那几条再摆一遍。</div>`
        : "");

  const box = `
    <div class="arm-box">
      <div class="box-h">
        <span class="bx-tag">第一拍 · 摊证据</span>
        <span class="bx-sub">已掌握 ${pool.length} 条 · 挑一条摊到他面前</span>
      </div>
      ${ch.evReply ? `<div class="reply-quote dead">${esc(sp.n)}：「${esc(ch.evReply)}」</div>` : ""}
      ${(ch.evCut && ch.evCutWhy && ch.evDead.indexOf(ch.evCut) >= 0)
        ? `<div class="bx-sub" style="margin-top:9px;color:var(--gold);line-height:1.75">这条被排除了 · ${esc(ch.evCutWhy)}</div>`
        : ""}
      ${grid}
      ${deads}
      <div class="row" style="margin-top:12px">
        <button class="btn primary"${ch.evPick ? "" : " disabled"} onclick="evGo()">把「${
          ch.evPick && CLUES[ch.evPick] ? esc(CLUES[ch.evPick].t) : "……"}」摆上桌</button>
      </div>
    </div>`;

  const dialog = `<div class="dialog"><div class="dlg-text">「${esc(c.say || "")}」</div></div>`;

  /* 张指导按战况出声：连错给方向、警戒高给台阶、连胜闭嘴 */
  const tip = mentorBox({
    normal: "",
    guide:  "别急着摊。先想一件事——这条线索，要经过谁的环节才立得住？",
    press:  "就剩这几样了。挑那条绕不开他本人的——他没法解释的那条。"
  });

  stage.innerHTML = head + sceneBlock("") + dialog + box + tip;
}

function evPickArm(id){
  const ch = S.ch;
  if(!ch || ch.evDead.indexOf(id) >= 0) return;
  ch.evPick = (ch.evPick === id) ? null : id;
  if(ch.evPick) FX.soft();
  render();
}

function evGo(){
  const c = curChain(); if(!c) return;
  const ch = S.ch, id = ch.evPick;
  if(!id) return;

  if(id === c.clue){
    const p = PLEA && PLEA[c.who] && PLEA[c.who][id];
    ch.phase    = "crack";
    ch.crackPick = -1;
    ch.crackNo   = [];
    ch.evReply   = "";
    ch.crackSegs = p ? segsOf(p.t) : [];
    ch.crackAt   = p ? weakSegOf(p.t, p.weak) : -1;
    ch.crackWeak = p ? p.weak : "";
    ch.crackTip  = p ? p.tip : "";
    if(S.unlockedClues && S.unlockedClues.indexOf(id) < 0) S.unlockedClues.push(id);
    FX.crack();
    FX.flash("rgba(229,72,77,.18)");
    FX.float("摊到点子上了", "var(--red)");
    render();
    return;
  }

  ch.evDead.push(id);
  ch.evWrongN++;
  ch.evReply = evadeLine(c.who, id);
  ch.evCut    = id;
  ch.evCutWhy = clueIsFor(id, c.who);
  ch.evPick  = null;
  alarmAdd(ALARM_EV);
  S.misses++; S.streak = 0;
  FX.bad("他挡回来了 · 警戒 +" + ALARM_EV, ALARM_EV);
  if((S.alarm || 0) >= 100) return forcePass("alarm");
  render();
}

/* ============ 第二拍 · 抓破绽 ============ */

  const box = `
