        : `<div class="bx-sub" style="margin-bottom:8px">他这段话里，哪一句站不住？</div>`}
      ${list}
      ${(!done && ch.crackNo.length)
        ? `<div class="ch-hint" style="margin-top:11px"><b>张指导：</b>不是这一句。他要遮的是哪件事？顺着那件事往回看。</div>`
        : ""}
    </div>`;

  const tip = mentorBox({
    normal: "摊证据是让他开口，抓破绽是让他收不回去。这一句点中，他才没法再绕。",
    guide:  "他绕，是因为有一句不能让你盯住。盯「时间」和「谁在场」——谎话最容易在这两处露口子。",
    press:  "别硬听内容。听语气——背下来的话没有细节，也没有停顿。",
    quiet:  "你手很稳。我不用说了。"
  });

  stage.innerHTML = head + sceneBlock(ch.crackDone ? "good" : (ch.crackNo.length ? "bad" : "")) + box + tip;
}

function crackPick(i){
  const c = curChain(); if(!c) return;
  const ch = S.ch;
  if(ch.crackDone || ch.crackNo.indexOf(i) >= 0) return;
  ch.crackPick = i;
  if(i === ch.crackAt){
    ch.crackDone = true;
    /* 有「读身体」数据的案件（第五案起）：先看行为，再问下一句 */
    ch.phase = c.read ? "read" : "ask";
    FX.crack();
    FX.flash("rgba(229,72,77,.18)");
    FX.float("抓到破绽", "var(--red)");
    render();
    return;
  }
  ch.crackNo.push(i);
  alarmAdd(ALARM_CK);
  S.misses++; S.streak = 0;
  FX.bad("不是这一处 · 警戒 +" + ALARM_CK, ALARM_CK);
  if((S.alarm || 0) >= 100) return forcePass("alarm");
  render();
}

/* ============ 第三拍半 · 读身体（《纸牌帮》「靠行为读信息」）============
   台词可以背，身体背不下来。抓住他嘴上那句之后，多看一眼他是怎么说出来的。
   三个身体细节里，只有一个是「跟他自己的话对不上」的；
   另外两个，他从进门到现在就是这样，说明不了什么。
   规律不预告——张指导只说「你自己看」，让玩家自己一层一层攒。 */
function renderRead(){
  chTimerStop();
  const c = curChain(); if(!c){ setStep(3); return; }
  const R = c.read;
  if(!R){ S.ch.phase = "ask"; return renderChoice(); }
  const ch = S.ch, sp = SUSPECTS[c.who], N = CHAIN.length;
  S.active = c.who;
  stage.className = "evidence" + (curArt() ? " arton" : "");

  const pct = Math.round(S.chainStep / N * 100);
  hudStep.textContent = "问话 · 读身体";
  hudFill.style.width = pct + "%";

  const head = `
    <div class="ch-head">
      <div class="ch-row">
        <span class="ch-n">第 <b>${S.chainStep+1}</b> / ${N} 层</span>
        <span class="ch-tag">${esc(c.tag)}</span>
        <span class="ch-wrong" style="color:var(--purple);background:rgba(163,113,247,.1);border-color:rgba(163,113,247,.32)">第三拍半 · 读身体</span>
        ${ch.readNo.length ? `<span class="ch-wrong">看错 ${ch.readNo.length} 次</span>` : ""}
      </div>
      <div class="ch-track"><i style="width:${pct}%"></i></div>
      ${alarmBar()}
    </div>`;

  const line = (ch.crackSegs && ch.crackSegs.length) ? ch.crackSegs.join("，") : "";
  const list = `<div class="crack-list">${R.opts.map(function(s, i){
      const dead = ch.readNo.indexOf(i) >= 0;
      const cls = "crack-item"
        + (dead ? " locked" : "")
        + (ch.readDone && ch.readPick === i ? " ok" : "");
      return `<button class="${cls}"${dead ? " disabled" : ""} onclick="readPick(${i})">
          <i>${"ABC"[i] || "·"}</i>${esc(s)}
        </button>`;
    }).join("")}</div>`;

  const box = `
    <div class="crack-box">
      <div class="box-h">
        <span class="bx-tag purple">第三拍半 · 读身体</span>
        <span class="bx-sub">他刚才那句话，你盯着他——哪一处，跟他自己说的对不上？</span>
      </div>
      ${line ? `<div class="reply-quote">「${esc(line)}」</div>` : ""}
      <div class="bx-sub" style="margin:8px 0 2px">${esc(R.lead)}</div>
      ${list}
      ${ch.readDone
        ? `<div class="mentor" style="margin-top:11px"><b>张指导：</b>${R.why}</div>
           <div class="rd-tell">记下了 · ${esc(R.tell)}</div>
           <div class="row" style="margin-top:10px"><button class="btn primary" onclick="readGo()">问下去 →</button></div>`
        : (ch.readNo.length
            ? `<div class="ch-hint" style="margin-top:11px"><b>张指导：</b>${esc(R.noWhy || "不是这一处。这个动作，他进门到现在一直都是这样的。")}</div>`
            : "")}
    </div>`;

  const tip = mentorBox({
    normal: "台词是背的，身体不是。看他不说话的时候，手放在哪、脚朝着哪。",
    guide:  "别盯他说的内容，盯他做的小动作——尤其是提到某一个词的时候。",
    press:  "他开始防你了。这个时候不该再往下问，该看。",
    quiet:  "你自己看就行。这一处我不用提醒你。"
  });

  stage.innerHTML = head + sceneBlock("") + box + tip;
}

function readPick(i){
  const c = curChain(); if(!c || !c.read) return;
  const R = c.read, ch = S.ch;
  if(ch.readDone || ch.readNo.indexOf(i) >= 0) return;
  ch.readPick = i;
  if(i === R.at){
    ch.readDone = true;
    S.readN = (S.readN || 0) + 1;
    if(!S.readSeen) S.readSeen = {};
    S.readSeen[c.who] = R.tell;
    S.defense[c.who] = Math.max(35, (S.defense[c.who] || 100) - 25);
    FX.read();
    FX.float("看对了 · " + ((SUSPECTS[c.who] && SUSPECTS[c.who].n) || "") + " 露了马脚", "var(--purple)");
    render();
    return;
  }
  ch.readNo.push(i);
  alarmAdd(8);
  S.misses++; S.streak = 0;
  FX.bad("看偏了 · 警戒 +8", 8);
  if((S.alarm || 0) >= 100) return forcePass("alarm");
  render();
}

function readGo(){
  const c = curChain(); if(!c || !c.read || !S.ch.readDone) return;
  S.ch.phase = "ask";
  FX.nav();
  render();
}

/* ============ 翻旧账 · 谎言台账 ============
   前面每一层，那个人都当着你的面说过一套话。走到后面，你可以把
   他的原话甩回桌上——挑对了，他没法圆；挑错了，他顺口就化解。
   判定不走 AI：哪条账能咬住当前这个人，写在 CHAIN[i].calls 里。 */

/* 手上有什么账：前面每层的「标准辩解」，玩家必然拿到（need 是强制的） */
function ledgerPool(){
  const out = [];
  for(let j = 0; j < S.chainStep; j++){
    const l = CHAIN[j];
    const p = PLEA[l.who] && PLEA[l.who][l.need];
    if(p) out.push({ by: l.who, clue: l.need });
  }
  return out;
}

/* 本层能甩的账 = 手上的账 ∩ 本层配好的判定 */
function ledgerEntries(){
  const c = curChain();
  if(!c || !c.calls || !c.calls.length) return [];
  return ledgerPool().map(function(p){
    const d = c.calls.filter(function(x){ return x.by === p.by && x.clue === p.clue; })[0];
    if(!d) return null;
    return { by: p.by, clue: p.clue, ok: d.ok, say: d.say, back: d.back, why: d.why };
  }).filter(Boolean);
}

function ledgerPanel(){
  const c = curChain();
  if(!c || !c.calls || !c.calls.length) return "";
  if(S.ch.keyDone || S.ch.scoldDone) return "";
  const list = ledgerEntries();
  if(!list.length) return "";
  const ch = S.ch;
  const items = list.map(function(e, i){
    const used = ch.scoldUsed.indexOf(i) >= 0;
    const tried = ch.scoldTry === i;
    let cls = "lg-item";
    if(used) cls += " used";
    if(tried && ch.scoldOk)  cls += " good";
    if(tried && !ch.scoldOk) cls += " bad";
    return `<button class="${cls}"${used ? " disabled" : ""} onclick="scold(${i})">
        <span class="lg-h"><b>${esc(SUSPECTS[e.by].n)}</b> · 关于「${esc(CLUES[e.clue] ? CLUES[e.clue].t : e.clue)}」</span>
        <span class="lg-t">「${esc(e.say)}」</span>
      </button>`;
  }).join("");
  return `
    <div class="lg-box">
      <div class="box-h">
        <span class="bx-tag gold">翻旧账</span>
        <span class="bx-sub">他们自己说过的话。挑一句甩到桌上——挑错，他顺口就化解了（警戒 +15）</span>
      </div>
      <div class="lg-list">${items}</div>
    </div>`;
}

/* ============ 张指导 · 动态导演 ============
   说书人思路：他不是流程提示器，是导演——只在该出手时出手。
     连胜 2 拍          → 闭嘴（玩家不需要扶手）
     累计失误 ≥ 3       → 递方向（给思路，不给答案）
     警戒 ≥ 80          → 递台阶（提前救场，代价是评级降一档，已在 alarmAdd 记账）
   状态全部读自 S，不新增状态机、不新增回合。 */
function mentorTone(){
  const al = S.alarm || 0, st = S.streak || 0, m = S.misses || 0;
  if(al >= 80) return "press";
  if(st >= 2)  return "quiet";
  if(m >= 3)   return "guide";
  return "normal";
}

/* o = {normal, guide, press, quiet}；缺省逐级回退，全缺则不出声 */
function mentorBox(o, cls){
  const t = mentorTone();
  let s;
  if(t === "quiet")      s = o.quiet;
  else if(t === "press") s = o.press || o.guide;
  else if(t === "guide") s = o.guide || o.normal;
  else                   s = o.normal;
  if(!s) return "";
  const tag = t === "press" ? "张指导（替你稳一手）" : "张指导";
  return `<div class="${cls || "ch-hint"}"><b>${tag}：</b>${s}</div>`;
}

function scold(i){
  const c = curChain(); if(!c) return;
  const ch = S.ch;
  if(ch.keyDone || ch.scoldDone) return;
  if(ch.scoldUsed.indexOf(i) >= 0) return;
  const e = ledgerEntries()[i]; if(!e) return;

  ch.scoldUsed.push(i);
  ch.scoldTry  = i;
  ch.scoldOk   = e.ok;
  ch.scoldName = SUSPECTS[e.by].n;
  ch.scoldSay  = e.say;
  ch.scoldBack = e.back;
  ch.scoldWhy  = e.why;
  S.scoldTries++;

  if(e.ok){
    /* 咬住了：不用再问，这一层就此钉死 */
    ch.scoldDone = true;
    ch.keyDone   = true;
    S.scolds++;
    S.hits++;
    S.streak++;
    if(S.streak > S.bestCombo) S.bestCombo = S.streak;
    applyDefense(c.who, 35);
    FX.hit();
    FX.flash("rgba(232,179,57,.22)");
    FX.shake(true);
    FX.float("旧账钉死", "var(--gold)");
    FX.combo(S.streak);
    render();
    return;
  }

  /* 没咬住：他顺口化解，警戒上涨 */
  S.misses++; S.streak = 0;
  alarmAdd(ALARM_QK);
  FX.bad("这条账他接得住 · 警戒 +" + ALARM_QK, ALARM_QK);
  if((S.alarm || 0) >= 100) return forcePass("alarm");
  render();
}

/* ============ 拼证词（第四案 · 收网前最后一步） ============
   十二张碎片都是老人的原话：每条单看都正常。把它们放进三个槽位——
   每槽恰一句正解。放错：碎片退回、警戒 +alarmOnWrong、计一次失误；
   拼齐：自动生成「完整剧本」，然后才进收网。警戒顶满照样走律师通道，不卡死。 */
/* 每槽容量：第四案是「一槽一句」（cap 缺省 1）；
   第五案是「一槽一组」（cap 3）——九句话分三组归位，另有六句会被误读进邻组。 */
function pieceCap(P){
  const n = (P && P.cap) ? P.cap : 1;
  return n > 1 ? n : 1;
}

function pieceNew(P){
  const cap = pieceCap(P);
  const placed = [];
  for(let i = 0; i < ((P && P.slots) ? P.slots.length : 3); i++) placed.push(cap > 1 ? [] : null);
  return { placed: placed, cap: cap, sel:-1, wrongN:0, lastWrong:-1, lastSlot:-1, tried:{},
           vPick:-1, vOk:false, vWrong:0, done:false, force:false };
}

/* 该槽里已放入的碎片，统一成数组（cap=1 时也返回数组） */
function pieceIn(p, si){
  const v = p.placed[si];
  if(v === null || v === undefined) return [];
  return Array.isArray(v) ? v : [v];
}

function pieceFull(p, P, si){
  return pieceIn(p, si).length >= pieceCap(P);
}

function pieceState(){
  if(!S.piece) S.piece = pieceNew(CURRENT_CASE && CURRENT_CASE.PIECE);
  const p = S.piece;
  /* 兼容：早期建立的对象（第四案一槽一句）补上 cap 与槽位形状 */
  if(p.cap === undefined) p.cap = pieceCap(CURRENT_CASE && CURRENT_CASE.PIECE);
  if(p.cap > 1){
    for(let i = 0; i < p.placed.length; i++){
      if(p.placed[i] === null || p.placed[i] === undefined) p.placed[i] = [];
      else if(!Array.isArray(p.placed[i])) p.placed[i] = [p.placed[i]];
    }
  }
  if(!p.tried) p.tried = {};
  if(p.lastSlot === undefined) p.lastSlot = -1;
  if(p.vPick === undefined) p.vPick = -1;
  if(p.vOk === undefined) p.vOk = false;
  if(p.vWrong === undefined) p.vWrong = 0;
  /* 跨槽版（第五案起）：alt 记录「同一句碎片在别的槽也能这么读」的岔路口 */
  if(p.altN === undefined)   p.altN = 0;
  if(p.lastAlt === undefined) p.lastAlt = "";
  if(p.lastAltSlot === undefined) p.lastAltSlot = -1;
  if(p.lastAltFrag === undefined) p.lastAltFrag = -1;
  return p;
}

function renderPiece(){
  chTimerStop();
  const P = CURRENT_CASE && CURRENT_CASE.PIECE;
  if(!P){ setStep(3); return; }
  const p = pieceState();
  const cap = pieceCap(P);
  S.active = null;
  stage.className = "";
  hudStep.textContent = "收网前 · 拼证词";
  hudFill.style.width = "100%";

  const totalNeed = P.slots.length * cap;
  const head = `
    <div class="ch-head">
      <div class="ch-row">
        <span class="ch-n">收网前</span>
        <span class="ch-tag">${cap > 1 ? "在场每个人说的话" : "老人的证词碎片"}</span>
        <span class="ch-wrong" style="color:var(--gold);background:rgba(232,179,57,.1);border-color:rgba(232,179,57,.32)">每槽 ${cap > 1 ? cap + " 句正解" : "一句正解"}</span>
      </div>
      ${alarmBar()}
    </div>`;

  const lead = `
    <div class="notice" style="border-left-color:var(--gold)">
      ${P.intro}
      <div style="margin-top:6px;font-size:11.5px;color:var(--fg3)">点一张碎片选中它，再点一个槽把它放进去。放错了它自己退回来——但对面会多一分警觉（警戒 +${P.alarmOnWrong}）。${
        P.frags.some(f => f.alt)
          ? "有的句子放在两个位置都讲得通：那不是你错，只说明<b>它真正发生的那一步只有一个</b>——读完解读，再把它挪走。"
          : ""}</div>
    </div>`;

  const usedAll = [];
  for(let si = 0; si < P.slots.length; si++) pieceIn(p, si).forEach(function(v){ usedAll.push(v); });
  const fragTried = function(i){
    return Object.keys(p.tried).filter(function(k){ return k.split(":")[1] === String(i); }).length;
  };
  const slotTried = function(si){
    return Object.keys(p.tried).filter(function(k){ return k.split(":")[0] === String(si); }).length;
  };
  const frags = P.frags.map((f, i) => {
    if(usedAll.indexOf(i) >= 0) return "";
    const cls = "pc-frag" + (p.sel === i ? " sel" : "");
    const fx = fragTried(i);
    return `<button class="${cls}" onclick="pieceSel(${i})">${esc(f.t)}${fx ? `<span class="pc-frag-x">✗${fx}</span>` : ""}</button>`;
  }).join("");

  const slots = P.slots.map((s, si) => {
    const inside = pieceIn(p, si);
    if(inside.length < cap){
      const sx = slotTried(si);
      const shake = (p.lastWrong >= 0 && p.lastSlot === si) ? " shake" : "";
      const have = inside.map(function(fi){
        return `<span class="pc-slot-t">「${esc(P.frags[fi].t)}」</span>`;
      }).join("");
      return `<div class="pc-slot empty${shake}" onclick="piecePut(${si})">
          <span class="pc-slot-h">${si+1}. ${esc(s)} · ${inside.length}/${cap}</span>
          ${have}
          <span class="pc-slot-t">${p.sel >= 0 ? "点这里，把选中的证词放进来" : "先在下面点一张证词"}${sx ? ` · 已排除 ${sx} 条` : ""}</span>
        </div>`;
    }
    const allOk = inside.every(function(fi){ return P.frags[fi].slot === si; });
    const list = inside.map(function(fi){
      return `<span class="pc-slot-t">「${esc(P.frags[fi].t)}」</span>`;
    }).join("");
    return `<div class="pc-slot ${allOk ? "ok" : ""}" onclick="pieceTake(${si})">
        <span class="pc-slot-h">${si+1}. ${esc(s)}${allOk ? " ✓ " + cap + "/" + cap : ""}</span>
        ${list}
      </div>`;
  }).join("");

  const wrongNote = (p.lastWrong !== undefined && p.lastWrong >= 0 && P.frags[p.lastWrong])
    ? `<div class="ch-fb bad"><div class="fb-h"><span class="fb-badge">放不进</span><b>这句证词，不属于这个位置</b></div>
         <div class="mentor"><b>张指导：</b>${p.wrongN >= 3
            ? "别硬凑了。这十二句话是按流程排的——先想「他当时是在哪一步做的」，再找那句话。"
            : "单独看，这句像什么都行。把它放回它真正发生的顺序里去。"}</div>
         ${(p.lastSlot >= 0 && P.slots[p.lastSlot]) ? `<div class="fb-note">「${esc(P.frags[p.lastWrong].t)}」已从「${esc(P.slots[p.lastSlot])}」排除——记住，这话不是发生在这一步的。</div>` : ""}
       </div>`
    : "";

  /* 跨槽：放进岔路口（alt）——说得通，但不是真发生的那一步。不扣分，只给解读。 */
  const altNote = (p.lastAlt && p.lastAltFrag >= 0 && P.frags[p.lastAltFrag])
    ? `<div class="ch-fb alt"><div class="fb-h"><span class="fb-badge">也能这么读</span><b>这一句放在这儿，讲得通</b></div>
         <div class="mentor"><b>张指导：</b>${esc(p.lastAlt)}</div>
         <div class="fb-note">「${esc(P.frags[p.lastAltFrag].t)}」从「${esc(P.slots[p.lastAltSlot])}」退回来了——不算你错，可它真正发生的位置只有一个。</div>
       </div>`
    : "";

  /* 拼齐之后：如果有结案陈词三选一，先把「哪一句盖得住全部十二句」答出来 */
  const V = P.verdicts;
  let verdict = "";
  if(V && V.length){
    if(p.vOk){
      verdict = `<div class="mentor" style="margin-top:10px"><b>张指导：</b>${esc((V[p.vPick] || {}).why || "就是这一条。")}</div>
        ${p.forceVerdict ? `<div class="notice" style="border-left-color:var(--red)">这一步你没答上来，张指导替你说的。不算你的。</div>` : ""}
        <div class="row"><button class="btn primary" onclick="setStep(3)">收网 · 指认主谋</button></div>`;
    } else {
      verdict = `<div class="box-h" style="margin-top:16px">
            <span class="bx-tag gold">结案陈词</span>
            <span class="bx-sub">十二句话摆在这儿了。哪一句，能同时解释它们？</span>
          </div>
          <div class="vc-list">${V.map(function(v, i){
            const bad = (p.vPick === i && !v.ok);
            return `<button class="vc-item${bad ? " no" : ""}" onclick="pieceVerdict(${i})">
                <span class="vc-k">${"ABC"[i] || "·"}</span><span class="vc-t">${esc(v.t)}</span>
              </button>`;
          }).join("")}</div>
          ${(p.vPick >= 0 && V[p.vPick] && !V[p.vPick].ok)
            ? `<div class="ch-fb bad"><div class="fb-h"><span class="fb-badge">盖不住</span><b>这套说法解释不了全部十二句</b></div>
                 <div class="mentor"><b>张指导：</b>${esc(V[p.vPick].why || "")}</div></div>`
            : ""}`;
    }
  } else {
    verdict = `<div class="mentor" style="margin-top:8px"><b>张指导：</b>你刚才不是在看证词，你是在看一套流程的说明书。现在，可以收网了。</div>
      <div class="row"><button class="btn primary" onclick="setStep(3)">收网 · 指认主谋</button></div>`;
  }

  const body = p.done
    ? `<div class="crack-box">
         <div class="box-h"><span class="bx-tag gold">完整剧本</span><span class="bx-sub">十二句话拼起来的，是一套流程</span></div>
         <div class="reply-quote" style="line-height:2.05">${P.assembled}</div>
         ${p.force ? `<div class="notice" style="border-left-color:var(--red)">警戒顶到了头——对面的律师到了。这份剧本是张指导替你拼完的，不算你的成绩。</div>` : ""}
         ${(p.altN || p.wrongN) ? `<div class="fb-note" style="margin-top:8px">这一轮：放错位置 ${p.wrongN} 次${p.altN ? ` · 走过岔路口 ${p.altN} 次（那些句子在别处也讲得通，但真正发生的那一步只有一个）` : ""}。</div>` : ""}
         ${verdict}
       </div>`
    : `<div class="crack-box">
         <div class="box-h"><span class="bx-tag gold">拼证词</span><span class="bx-sub">${P.slots.length} 个位置 · 共 ${totalNeed} 句进槽 · 选中后点槽位放入</span></div>
         <div class="pc-slots">${slots}</div>
         ${wrongNote}
         ${altNote}
         <div class="pc-frags">${frags}</div>
       </div>`;

  stage.innerHTML = head + lead + body;
}

function pieceSel(i){
  const P = CURRENT_CASE && CURRENT_CASE.PIECE; if(!P) return;
  const p = pieceState();
  if(p.done) return;
  p.sel = (p.sel === i) ? -1 : i;
  p.lastWrong = -1;
  p.lastAlt = "";
  if(p.sel >= 0) FX.soft();
  render();
}

function piecePut(si){
  const P = CURRENT_CASE && CURRENT_CASE.PIECE; if(!P) return;
  const p = pieceState();
  const cap = pieceCap(P);
  if(p.done) return;
  if(p.sel < 0) return;
  if(cap > 1 && pieceFull(p, P, si)) return;   /* 组模式：这一槽已经满了，不再接 */
  /* 一槽一句时，砸已放对的槽照走下面判定——不覆盖，但代价照算 */
  const fi = p.sel;
  if(P.frags[fi].slot === si){
    const arr = pieceIn(p, si);
    if(arr.indexOf(fi) >= 0) return;
    if(cap > 1){ arr.push(fi); } else { p.placed[si] = fi; }
    p.sel = -1; p.lastWrong = -1; p.lastAlt = "";
    let full = true;
    for(let k = 0; k < P.slots.length; k++){ if(!pieceFull(p, P, k)) full = false; }
    if(full){ p.done = true; FX.piece(); renderPiece(); return; }
    FX.piece();
    FX.float("归位", "var(--gold)");
    render();
    return;
  }
  /* 跨槽：这一句放进「岔路口」——也说得通，但不是案子里发生的那一步。
     不扣分、不加警戒，只给一句过渡解读；碎片仍然退回（正解只有一个）。 */
  const F = P.frags[fi];
  const altText = (F.alt && F.alt[si]) || "";
  if(altText){
    p.altN++;
    p.lastAlt = altText;
    p.lastAltSlot = si;
    p.lastAltFrag = fi;
    p.lastWrong = -1; p.lastSlot = -1; p.sel = -1;
    FX.soft();
    FX.float("也能这么读", "var(--purple)");
    render();
    return;
  }
  /* 放错：退回 + 代价（但留下排除信息：这条不属于这个位置） */
  p.wrongN++; p.lastWrong = fi; p.lastSlot = si; p.sel = -1; p.lastAlt = "";
  p.tried[si + ":" + fi] = true;
  S.misses++; S.streak = 0;
  alarmAdd(P.alarmOnWrong || 10);
  FX.bad("放不进 · 警戒 +" + (P.alarmOnWrong || 10), P.alarmOnWrong || 10);
  if((S.alarm || 0) >= 100){
    p.done = true; p.force = true;
    S.forceN = (S.forceN || 0) + 1;
    renderPiece(); return;
  }
  render();
}

function pieceTake(si){
  const P = CURRENT_CASE && CURRENT_CASE.PIECE; if(!P) return;
  const p = pieceState();
  if(p.done) return;
  if(pieceCap(P) > 1) return;            /* 组模式：进槽的都是正解，不给取回 */
  const fi = p.placed[si];
  if(fi === null || fi === undefined) return;
  if(P.frags[fi].slot === si) return;   /* 放对的锁死，不给取回 */
  p.placed[si] = null;
  p.sel = fi;
  render();
}

/* 结案陈词三选一：拼齐只是第一步，选对「盖得住全部十二句」的那句才算结案。
   选错：这套说法盖不住，给一句解释不了什么的说明，可重选。 */
function pieceVerdict(i){
  const P = CURRENT_CASE && CURRENT_CASE.PIECE; if(!P || !P.verdicts) return;
  const p = pieceState();
  if(!p.done || p.vOk) return;
  const v = P.verdicts[i]; if(!v) return;
  p.vPick = i;
  if(v.ok){ p.vOk = true; renderPiece(); return; }
  p.vWrong++;
  S.misses++; S.streak = 0;
  alarmAdd(8);
  /* 兜底：再错下去也不能卡死——张指导替你说，代价照记 */
  if((S.alarm || 0) >= 100){ p.vOk = true; p.forceVerdict = true; }
  renderPiece();
}

/* ============ 案件重演 · 四十分钟（第六案 · 收网前最后一步）============
   《Murdoku》思路：把四个人的位置一格一格排回那 40 分钟里。
   两条约束同时成立——任一时刻四人分处四处（每列是一个排列）；
   一圈走下来每个人也走遍这四个地方（每行是一个排列）。
   证词里已经说死的 10 格开局填好，剩 6 格由玩家补，解唯一（48 万种排法里只活一种）。
   放错：这一格排除这个地点，警戒 +alarmOnWrong；排满：进收网。
   警戒顶满照样走律师通道——张指导把表填完，不算玩家的成绩。 */

const GRID_WRONG = [
  "他不在那儿。证词里没人把他放在这个位置——这一格是你在替他安排。",
  "还是不对。同一时刻四个人分在四个地方，一格错了，整条时间线就都对不上。",
  "别急着填。先挑一个你知道得最死的格子：谁会什么时候必须站在自己岗位上？",
  "这张表里已经有一格只剩一个可能了。找不到它，就先把它旁边那几格排出来。"
];

function gridState(){
  if(!(CURRENT_CASE && CURRENT_CASE.GRID)) return null;
  if(!S.grid) S.grid = gridInit();
  const g = S.grid;
  if(!g.tried) g.tried = {};
  if(g.cell === undefined) g.cell = -1;
  if(g.lastWrong === undefined) g.lastWrong = -1;
  if(g.lastWhy === undefined) g.lastWhy = "";
  if(g.hintN === undefined) g.hintN = 0;
  if(g.wrongN === undefined) g.wrongN = 0;
  return g;
}

function gridInit(){
  const G = CURRENT_CASE.GRID;
  const R = G.people.length, C = G.times.length;
  const m = [], lock = {};
  for(let i = 0; i < R * C; i++) m.push(-1);
  Object.keys(G.fixed).forEach(function(k){
    const a = k.split(":");
    m[(+a[0]) * C + (+a[1])] = G.fixed[k];
    lock[k] = true;
  });
  return { m: m, lock: lock, cell: -1, tried: {}, wrongN: 0, hintN: 0, lastWrong: -1, lastWhy: "", done: false, force: false };
}

function gridDims(){
  const G = CURRENT_CASE.GRID;
  return { G: G, R: G.people.length, C: G.times.length };
}

/* 这一格现在还剩哪些可能：同行同列没被占、且没被试错的排除掉 */
function gridCand(idx){
  const g = gridState(), d = gridDims();
  const r = Math.floor(idx / d.C), c = idx % d.C, out = [];
  for(let v = 0; v < d.G.places.length; v++){
    if(g.tried[idx + ":" + v]) continue;
    let used = false;
    for(let k = 0; k < d.C; k++){ if(k !== c && g.m[r * d.C + k] === v) used = true; }
    for(let k = 0; k < d.R; k++){ if(k !== r && g.m[k * d.C + c] === v) used = true; }
    if(!used) out.push(v);
  }
  return out;
}

/* 已经只剩一个可能的格子（张指导能替你推的那一格） */
function gridForced(){
  const g = gridState();
  if(!g) return null;
  for(let i = 0; i < g.m.length; i++){
    if(g.m[i] >= 0) continue;
    const cd = gridCand(i);
    if(cd.length === 1) return { idx: i, v: cd[0], n: 1 };
  }
  /* 没有唯一格：退一步，给候选最少的那一格 */
  let best = null;
  for(let i = 0; i < g.m.length; i++){
    if(g.m[i] >= 0) continue;
    const cd = gridCand(i);
    if(cd.length > 1 && (!best || cd.length < best.n)) best = { idx: i, v: cd[0], n: cd.length, soft: true };
  }
  return best;
}

function renderGrid(){
  chTimerStop();
  const G = CURRENT_CASE && CURRENT_CASE.GRID;
  if(!G){ setStep(3); return; }
  const g = gridState(), d = gridDims();
  S.active = null;
  stage.className = "";
  hudStep.textContent = "收网前 · 案件重演";
  hudFill.style.width = "100%";

  const emptyN = g.m.filter(function(x){ return x < 0; }).length;

  const head = `
    <div class="ch-head">
      <div class="ch-row">
        <span class="ch-n">收网前</span>
        <span class="ch-tag">案件重演 · 四个人 · 四十分钟</span>
        <span class="ch-wrong" style="color:var(--purple);background:rgba(163,113,247,.1);border-color:rgba(163,113,247,.32)">${g.done ? "已排满" : "还差 " + emptyN + " 格"}</span>
        ${g.wrongN ? `<span class="ch-wrong">排错 ${g.wrongN} 格</span>` : ""}
      </div>
      ${alarmBar()}
    </div>`;

  const lead = `
    <div class="notice" style="border-left-color:var(--purple)">
      ${esc(G.intro)}
      <div style="margin-top:6px;font-size:11.5px;color:var(--fg3)">规则两条：<b>任一时刻，四个人分在四个不同的地方</b>；<b>一圈走下来，每个人也都走遍这四个地方</b>。证词说死的格子已经填好了，剩下 ${emptyN} 格由你补——点空格，再从下面挑一个地点。放错他会多一分警觉（警戒 +${G.alarmOnWrong}）。</div>
    </div>`;

  const src = `<div class="box-h" style="margin-top:15px"><span class="bx-tag gold">他们各自说的</span><span class="bx-sub">这五句，就是已经说死的那些格子</span></div>
    <div class="gd-src">${G.sources.map(function(s){ return esc(s); }).join("<br>")}</div>`;

  /* 表：行 = 人，列 = 时间，值 = 地点 */
  let rows = `<tr><th class="gd-p"></th>${G.times.map(function(t){ return `<th>${esc(t)}</th>`; }).join("")}</tr>`;
  for(let r = 0; r < d.R; r++){
    const sp = SUSPECTS[G.people[r]] || { n: G.people[r], color: "var(--fg2)" };
    const tds = [];
    for(let c = 0; c < d.C; c++){
      const i = r * d.C + c, v = g.m[i], isLock = !!g.lock[r + ":" + c];
      const exN = Object.keys(g.tried).filter(function(k){ return k.split(":")[0] === String(i); }).length;
      const xm = exN ? `<span class="gd-x">✗${exN}</span>` : "";
      if(v >= 0){
        tds.push(`<td class="gd-cell ${isLock ? "fx" : "ok"}">${esc(G.places[v])}${xm}</td>`);
      } else {
        const cls = "gd-cell empty" + (g.cell === i ? " sel" : "") + (g.lastWrong === i ? " no" : "");
        tds.push(`<td class="${cls}" onclick="gridSel(${i})"><span class="gd-q">？</span>${xm}</td>`);
      }
    }
    rows += `<tr><th class="gd-p" style="color:${sp.color}">${esc(sp.n)}</th>${tds.join("")}</tr>`;
  }
  const table = `<div class="gd-wrap"><table class="gd-table">${rows}</table></div>`;

  /* 地点选择盘：选中一个空格之后才出现 */
  let pal = "";
  if(!g.done && g.cell >= 0 && g.m[g.cell] < 0){
    const r = Math.floor(g.cell / d.C), c = g.cell % d.C;
    const cand = gridCand(g.cell);
    const sp = SUSPECTS[G.people[r]] || { n: G.people[r], color: "var(--fg2)" };
    pal = `<div class="box-h" style="margin-top:15px">
        <span class="bx-tag purple">这一格</span>
        <span class="bx-sub"><b style="color:${sp.color}">${esc(sp.n)}</b> · ${esc(G.times[c])} —— 他当时在哪儿？</span>
      </div>
      <div class="gd-pal">${G.places.map(function(p, v){
        const dead = Object.prototype.hasOwnProperty.call(g.tried, g.cell + ":" + v);
        return `<button class="gd-pl${dead ? " dead" : ""}"${dead ? " disabled" : ""} onclick="gridPut(${v})">${esc(p)}</button>`;
      }).join("")}</div>
      <div class="gd-legend">这一格现在还剩 <b>${cand.length}</b> 个可能${cand.length === 1 ? " ——已经唯一了，放下去就是对的" : ""}。</div>`;
  } else if(!g.done){
    pal = `<div class="gd-legend" style="margin-top:14px">点表里任意一个「？」格子，再给它挑一个地点。</div>`;
  }

  /* 张指导替你推一格（有余地时才递——但会记一笔，结案复盘里会写出来） */
  const f = g.done ? null : gridForced();
  const assist = f
    ? `<div class="row" style="margin-top:12px">
         <button class="btn ghost" onclick="gridAuto()">让张指导替你推一格</button>
         <span style="font-size:11.5px;color:var(--fg3);align-self:center">${f.soft ? "没有唯一格了，他会挑最省事的那一格" : "有一格已经只剩一个可能了"}</span>
       </div>`
    : "";

  const wrongNote = (!g.done && g.lastWrong >= 0 && g.lastWhy)
    ? `<div class="ch-fb bad" style="margin-top:13px">
         <div class="fb-h"><span class="fb-badge">放不进去</span><b>这一格，他不在那儿</b></div>
         <div class="mentor"><b>张指导：</b>${esc(g.lastWhy)}</div>
         <div class="fb-note">这一格已经把「${esc(G.places[g.lastWrongV] || "")}」排除掉了——记住，那个时刻他不在那儿。</div>
       </div>`
    : "";

  const body = g.done
    ? `<div class="crack-box" style="margin-top:15px">
         <div class="box-h"><span class="bx-tag purple">四十分钟 · 排完了</span><span class="bx-sub">时间线一对齐，空的那块自己就露出来了</span></div>
         ${table}
         <div class="reply-quote" style="margin-top:12px">${esc(G.solvedLine)}</div>
         ${g.force ? `<div class="notice" style="border-left-color:var(--red)">${esc(G.forceLine)}</div>` : ""}
         ${g.hintN ? `<div class="fb-note" style="margin-top:8px">这张表里，有 ${g.hintN} 格是张指导替你推的。</div>` : ""}
         <div class="row"><button class="btn primary" onclick="setStep(3)">收网 · 指出是谁做的</button></div>
       </div>`
    : `<div class="crack-box" style="margin-top:15px">
         <div class="box-h"><span class="bx-tag purple">案件重演</span><span class="bx-sub">点空格 → 挑地点 · 金色格子是证词已经说死的</span></div>
         ${table}
         ${pal}
         ${assist}
         ${wrongNote}
       </div>`;

  const tip = mentorBox({
    normal: "别一格一格试。先找「已经只剩一个可能」的那格——通常在某一行或某一列快填满的地方。",
    guide:  "看列：哪个时刻已经有三个位置被占了，第四个自动就定了。再看行：哪个人已经去过三个地方了。",
    press:  "他已经在盯着你的表了。这个时候要快——先填死那些不用想的。",
    quiet:  "这一格你自己看得出来。我不提醒。"
  });

  stage.innerHTML = head + lead + src + body + tip;
}

function gridSel(i){
  const g = gridState(); if(!g) return;
  if(g.done || g.m[i] >= 0) return;
  g.cell = (g.cell === i) ? -1 : i;
  g.lastWrong = -1; g.lastWhy = "";
  if(g.cell >= 0) FX.soft();
  render();
}

function gridPut(v){
  const G = CURRENT_CASE && CURRENT_CASE.GRID; if(!G) return;
  const g = gridState(), d = gridDims();
  if(!g || g.done || g.cell < 0 || g.m[g.cell] >= 0) return;
  const idx = g.cell, r = Math.floor(idx / d.C), c = idx % d.C;
  if(g.tried[idx + ":" + v]) return;

  if(G.solution[r][c] === v){
    g.m[idx] = v;
    g.cell = -1; g.lastWrong = -1; g.lastWhy = "";
    FX.grid();
    FX.float("落位", "var(--blue)");
    if(g.m.every(function(x){ return x >= 0; })){ g.done = true; renderGrid(); return; }
    render(); return;
  }

  g.wrongN++;
  g.tried[idx + ":" + v] = true;
  g.lastWrong = idx;
  g.lastWrongV = v;
  g.lastWhy = GRID_WRONG[Math.min(g.wrongN - 1, GRID_WRONG.length - 1)];
  S.misses++; S.streak = 0;
  alarmAdd(G.alarmOnWrong || 6);
  FX.bad("排不进去 · 警戒 +" + (G.alarmOnWrong || 6), G.alarmOnWrong || 6);
  /* 警戒顶满：张指导把剩下的填完，代价照记（不算玩家的成绩） */
  if((S.alarm || 0) >= 100){
    for(let i = 0; i < g.m.length; i++){
      if(g.m[i] < 0) g.m[i] = G.solution[Math.floor(i / d.C)][i % d.C];
    }
    g.done = true; g.force = true;
    S.forceN = (S.forceN || 0) + 1;
    renderGrid(); return;
  }
  render();
}

/* 张指导替你推一格：优先填「只剩一个可能」的格子 */
function gridAuto(){
  const G = CURRENT_CASE && CURRENT_CASE.GRID; if(!G) return;
  const g = gridState(), d = gridDims();
  if(!g || g.done) return;
  const f = gridForced(); if(!f) return;
  g.m[f.idx] = f.v;
  g.hintN++;
  g.cell = -1; g.lastWrong = -1; g.lastWhy = "";
  FX.soft();
  FX.float("张指导替你推了一格", "var(--gold)");
  if(g.m.every(function(x){ return x >= 0; })){ g.done = true; renderGrid(); return; }
  render();
}

function renderChoice(){
  chTimerStop();
  const c = curChain();
  if(!c){
    /* 链走完了：收网前可能有「拼证词」（第四/五案 PIECE）或「案件重演」（第六案 GRID） */
    const P = CURRENT_CASE && CURRENT_CASE.PIECE;
    if(P && S.piece && !S.piece.done) return renderPiece();
    const G = CURRENT_CASE && CURRENT_CASE.GRID;
    if(G && S.grid && !S.grid.done) return renderGrid();
    setStep(3); return;
  }

  /* 每层先勘察现场：没翻到关键那件，不进问话 */
  if(curSite() && S.sv && !S.sv.done) return renderProbe();

  /* 四拍闸门：摊证据 → 抓破绽 → 读身体 → 四选一追问 */
  if(S.ch.phase === "evidence") return renderEvidence();
  if(S.ch.phase === "crack")    return renderCrack();
  if(S.ch.phase === "read")     return renderRead();

  S.active = c.who;
  stage.className = "evidence" + (curArt() ? " arton" : "");

  const ch = S.ch, total = CHAIN.length, sp = SUSPECTS[c.who];
  const picked = ch.pick >= 0 ? c.opts[ch.pick] : null;
  const isKey  = ch.keyDone;
  const pct    = Math.round(S.chainStep / total * 100);
  hudStep.textContent = "问话 · 追问";
  hudFill.style.width = pct + "%";

  const head = `
    <div class="ch-head">
      <div class="ch-row">
        <span class="ch-n">第 <b>${S.chainStep+1}</b> / ${total} 层</span>
        <span class="ch-tag">${esc(c.tag)}</span>
        <span class="ch-wrong" style="color:var(--green);background:rgba(63,185,80,.1);border-color:rgba(63,185,80,.32)">第三拍 · 追问</span>
        ${ch.wrongN ? `<span class="ch-wrong">已绕 ${ch.wrongN} 次</span>` : ""}
      </div>
      <div class="ch-track"><i style="width:${pct}%"></i></div>
      ${alarmBar()}
    </div>`;

  /* 现场勘察拿到的线索，带进问话里 */
  const site = curSite();
  const gains = site
    ? site.items.filter((o,i)=> S.sv.opened.indexOf(i) >= 0 && o.gain).map(o=>o.gain)
    : [];
  const evBar = gains.length
    ? `<div class="ev-bar"><span>现场所得 ${gains.length} 条：</span>${
        gains.map(g=>`<span class="ev-chip">${esc(g)}</span>`).join("")}</div>`
    : "";

  /* 演出：对方的反应——问错了前倾逼近，问对了后仰靠回椅背。
     选项自带 rx 时优先用它（push/hit/pull/pan/hold），可以给单个选项定制镜头。 */
  const react = picked ? (picked.rx || (picked.k === "key" ? "good" : (picked.k === "mid" ? "mid" : "bad"))) : "";

  /* 演出：抉择倒计时。已经在看反馈、或本层已命中，就不再计时 */
  const counting = !isKey && !picked;
  const timer = counting
    ? `<div class="ch-timer-wrap">
        <div class="ch-timer"><span>你得现在就开口</span><span class="tnum" id="chTimerTxt">${ch.tLimit}s</span></div>
        <div class="ch-tbar" id="chTimerBar"><i id="chTimerFill" style="width:100%"></i></div>
      </div>`
    : "";

  /* 翻旧账：把他的话甩回桌上，紧接着是他的回应 */
  const cast = (ch.scoldTry >= 0 && !picked)
    ? `<div class="scold-cast${ch.scoldOk ? "" : " fail"}">
         <b>你把他的话甩回桌上：</b>「${esc(ch.scoldSay)}」
       </div>`
    : "";

  const dialog = `
    <div class="dialog">
      <div class="dlg-text">${picked ? picked.reply
        : (ch.scoldTry >= 0 ? "「" + esc(ch.scoldBack) + "」" : "「" + c.say + "」")}</div>
    </div>`;

  let opts = "";
  if(!isKey){
    opts = `<div class="ch-opts">
      <div class="ch-lead">${picked ? "再问他一句——" : "你开口问："}</div>
      ${c.opts.map((o,i)=>{
        const dead = ch.picked.indexOf(i) >= 0;
        const cls  = "opt" + (dead ? " done" : "")
          + (picked && ch.pick === i && !dead ? (o.k === "key" ? " good" : " bad") : "");
        return `<button class="${cls}"${dead ? " disabled" : ""} onclick="choicePick(${i})">
            <span class="opt-k">${"ABCD"[i]}</span><span class="opt-t">${o.t}</span>
          </button>`;
      }).join("")}
    </div>`;
  }

  /* 翻旧账面板：手上有账、且这一层还没被钉死时出现 */
  const ledger = (!isKey && !ch.scoldDone) ? ledgerPanel() : "";

  const hint = (ch.hint && !isKey)
    ? mentorBox({
        normal: ch.timeoutMsg
          ? "别慌。把你在现场看到的东西串一串——哪两样本该一致，却对不上？"
          : esc(c.hint3 || ""),
        guide: ch.timeoutMsg
          ? "别慌。把你在现场看到的东西串一串——哪两样本该一致，却对不上？"
          : esc(c.hint3 || "") + " 再往下一层想：他为什么要遮住这件事？",
        press: "他开始防着你了。这时候别问「是什么」，问「为什么」——问动机，人容易露。",
        quiet: ""
      })
    : "";

  let fb = "";
  if(ch.scoldTry >= 0 && !picked){
    fb = `<div class="ch-fb ${ch.scoldOk ? "good" : "bad"}">
        <div class="fb-h">
          <span class="fb-badge">${ch.scoldOk ? "旧账咬住了" : "没咬住"}</span>
          <b style="color:${sp.color}">${esc(ch.scoldName)}</b>
        </div>
        <div class="mentor"><b>张指导：</b>${esc(ch.scoldWhy)}</div>
      </div>`;
  } else if(picked && !ch.force){
    const badge = isKey ? "命中要害" : (picked.k === "mid" ? "有收获" : "没问在点上");
    fb = `<div class="ch-fb ${isKey ? "good" : "bad"}">
        <div class="fb-h">
          <span class="fb-badge">${badge}</span>
          <b style="color:${sp.color}">${sp.n}</b>
        </div>
        <div class="mentor"><b>张指导：</b>${picked.why}</div>
        ${picked.note ? `<div class="fb-note">${picked.note}</div>` : ""}
      </div>`;
  }

  let tail = "";
  if(ch.force){
    const nextLabel = nextLabelText();
    tail = `<div class="notice" style="border-left-color:var(--red)">
        律师到了，这次谈话只能停在这。张指导把话接了过去——「${esc(c.hint3 || "这条我替你说")}」。<br>
        对方没法不答。但这一次，不算你自己问出来的。
        <div><button class="btn primary" onclick="choiceNext()">${nextLabel}</button></div>
        <div style="margin-top:8px;font-size:11.5px;color:var(--fg3)">本层记为失手通过 · 收网评级降一档</div>
      </div>`;
  } else if(isKey){
    if(c.action && !ch.actDone){
      tail = `<div class="row"><button class="btn primary" onclick="choiceAct()">去查：${esc(c.action)}</button></div>`;
    } else {
      const nextLabel = nextLabelText();
      tail = `<div class="notice" style="border-left-color:var(--green)">
          ${ch.actDone && c.actionDone ? c.actionDone : (c.onPass || "")}
        </div>
        <div class="row"><button class="btn primary" onclick="choiceNext()">${nextLabel}</button></div>`;
    }
  }

  stage.innerHTML = head + sceneBlock(react) + evBar + timer + cast + dialog + opts + ledger + fb + hint + tail;
  chTimerStart();
  FX.typeDialog();
}

function choicePick(i){
  const c = curChain(); if(!c) return;
  const ch = S.ch;
  if(ch.keyDone) return;
  const o = c.opts[i];
  if(!o || ch.picked.indexOf(i) >= 0) return;

  ch.pick = i;
  ch.timeoutMsg = false;
  if(o.k === "key"){
    ch.keyDone = true;
    if(ch.wrongN === 0){
      S.hits++;
      S.streak++;
      if(S.streak > S.bestCombo) S.bestCombo = S.streak;
      FX.good("命中要害");
      FX.combo(S.streak);
    } else {
      S.streak = 0;
      FX.good("这一句问住了他");
    }
  } else {
    ch.picked.push(i);
    ch.wrongN++;
    S.misses++;
    S.streak = 0;
    if(ch.wrongN >= 2) ch.hint = true;
    alarmAdd(ALARM_QK);
    S.defense[c.who] = Math.max(35, 100 - 25 * ch.wrongN);
    if(o.k === "mid"){ FX.soft(); FX.float("有收获 · 警戒 +" + ALARM_QK, "var(--gold)"); }
    else { FX.bad("没问在点上 · 警戒 +" + ALARM_QK, ALARM_QK); }
    if((S.alarm || 0) >= 100) return forcePass("alarm");
  }
  S.defense[c.who] = Math.max(35, 100 - 25 * ch.wrongN);
  render();
}

function choiceAct(){
  if(!curChain() || !S.ch.keyDone) return;
  S.ch.actDone = true;
  FX.open();
  render();
}

/* ============ 本局回放 ============
   《Your Only Move Is Hustle》思路：一局打完，把过程拉成时间线。
   数据本来就在 S 里，只在每层结束时抄一份快照即可。 */
function tracePush(c){
  const ch = S.ch; if(!c || !ch) return;
  if(!S.trace) S.trace = [];
  S.trace.push({
    who: c.who,
    tag: c.tag || "",
    act: c.action ? (ch.actDone ? 1 : 0) : -1,
    evWrong: ch.evWrongN || 0,
    crackWrong: (ch.crackNo || []).length,
    readWrong: (ch.readNo || []).length,
    askWrong: ch.wrongN || 0,
    asks: (ch.picked || []).length,
    scold: ch.scoldDone ? (ch.scoldName || "") : "",
    scoldTry: (ch.scoldUsed || []).length,
    hint: !!ch.hint,
    force: !!ch.force,
    alarm: S.alarm || 0
  });
}

function traceBlock(){
  const tr = S.trace || [];
  if(!tr.length) return "";
  const rows = tr.map(function(t, i){
    const sp = SUSPECTS[t.who] || { n: t.who, color: "var(--fg2)" };
    const bits = [];
    if(t.evWrong)    bits.push("摊证据挡回 " + t.evWrong + " 次");
    if(t.crackWrong) bits.push("抓破绽点错 " + t.crackWrong + " 拍");
    if(t.readWrong)  bits.push("看身体看错 " + t.readWrong + " 次");
    if(t.asks)       bits.push("追问 " + t.asks + " 轮");
    if(t.askWrong)   bits.push("问偏 " + t.askWrong + " 次");
    if(t.act === 0)  bits.push("跳过了查证");
    if(t.scold)          bits.push("旧账咬住 · " + t.scold);
    else if(t.scoldTry)  bits.push("翻旧账未果 " + t.scoldTry + " 次");
    if(t.hint)       bits.push("用过提示");
    const clean = !t.evWrong && !t.crackWrong && !t.askWrong && !t.readWrong && !t.scoldTry && !t.force;
    const res = t.force ? "失手通过" : (clean ? "干净拿下" : "有磕碰");
    const cls = t.force ? "bad" : (clean ? "ok" : "");
    return `<div class="rp-step ${cls}">
        <div class="rp-h">
          <b>第 ${i+1} 层</b>
          <span class="rp-who" style="color:${sp.color}">${esc(sp.n)}</span>
          <span class="rp-tag2">${esc(t.tag)}</span>
          <span class="rp-res ${cls}">${res}</span>
        </div>
        <div class="rp-b">${bits.length ? bits.join(" · ") : "一步没错"} &nbsp;·&nbsp; 收官警戒 ${t.alarm}</div>
      </div>`;
  }).join("");
  const cleanN = tr.filter(function(t){
    return !t.force && !t.evWrong && !t.crackWrong && !t.askWrong && !t.readWrong;
  }).length;
  const sum = `<div class="rp-sum">四层里干净拿下的有 <b style="color:var(--gold)">${cleanN}</b> 层 · ` +
    (S.directorN ? `张指导替你稳了 <b style="color:var(--red)">${S.directorN}</b> 次（成绩已降档）` : "张指导全程没插手") +
    `</div>`;
  return `<h3 style="margin-top:19px">本局回放</h3><div class="rp-list">${rows}</div>${sum}`;
}

/* 读身体的收获（第五案起的机制）：这一局你从行为里读出了什么。
   没有记录就不出这一段——前三案不受影响。 */
function readBlock(){
  const seen = S.readSeen || {};
  const ids = Object.keys(seen);
  if(!ids.length) return "";
  const items = ids.map(function(id){
    const sp = SUSPECTS[id] || { n:id, color:"var(--fg2)" };
    return `<li><b style="color:${sp.color}">${esc(sp.n)}</b>：${esc(seen[id])}</li>`;
  }).join("");
  return `<h3 style="margin-top:19px">你记下的身体信号</h3>
    <div class="notice" style="border-left-color:var(--purple)">
      台词可以背，身体背不下来。这一局，你从他们的动作里读出了这些：
      <ul class="clean" style="margin-top:9px">${items}</ul>
      <div style="margin-top:7px;font-size:11.5px;color:var(--fg3)">读对 ${S.readN||0} 次 · 看错会让他更警觉（警戒 +8）</div>
    </div>`;
}

/* 案件重演的结果（第六案起的机制）：这一局你把那四十分钟排成了什么样。
   没进过这一步（或没排完）就不出这一段——前五案不受影响。 */
function gridBlock(){
  const G = CURRENT_CASE && CURRENT_CASE.GRID;
  const g = S.grid;
  if(!G || !g || !g.done) return "";
  const d = gridDims();
  let rows = `<tr><th class="gd-p"></th>${G.times.map(function(t){ return `<th>${esc(t)}</th>`; }).join("")}</tr>`;
  for(let r = 0; r < d.R; r++){
    const sp = SUSPECTS[G.people[r]] || { n: G.people[r], color: "var(--fg2)" };
    const tds = [];
    for(let c = 0; c < d.C; c++){
      const v = G.solution[r][c];
      const isLock = !!g.lock[r + ":" + c];
      tds.push(`<td class="gd-cell ${isLock ? "fx" : "ok"}">${esc(G.places[v])}</td>`);
    }
    rows += `<tr><th class="gd-p" style="color:${sp.color}">${esc(sp.n)}</th>${tds.join("")}</tr>`;
  }
  return `<h3 style="margin-top:19px">四十分钟 · 重演出来的时间线</h3>
    <div class="notice" style="border-left-color:var(--purple)">
      <div class="gd-wrap"><table class="gd-table">${rows}</table></div>
      <div style="margin-top:10px">${esc(G.solvedLine)}</div>
      <div style="margin-top:7px;font-size:11.5px;color:var(--fg3)">金色是证词里说死的 · 绿色是你自己排出来的 ${g.m.filter(function(x,i){ return x >= 0 && !g.lock[Math.floor(i/d.C) + ":" + (i % d.C)]; }).length} 格 · 排错 ${g.wrongN} 格${g.hintN ? ` · 张指导替你推了 ${g.hintN} 格` : ""}${g.force ? " · 最后是张指导收的表" : ""}</div>
    </div>`;
}

function choiceNext(){
  const c = curChain(); if(!c) return;
  if(!S.ch.keyDone) return;                  // 没问出要害不许往下走
  FX.nav();

  tracePush(c);                              // 先记下这一层的过程，再推进
  S.chainStep++;
  if(c.unlock && S.met && S.met.indexOf(c.unlock) < 0) S.met.push(c.unlock);
  chReset();
  const nx = curChain();
  S.active = nx ? nx.who : null;
  if(nx){ render(); return; }
  /* 最后一层过完：第四/五案先拼老人的证词（PIECE 相位） */
  const P = CURRENT_CASE && CURRENT_CASE.PIECE;
  if(P && !(S.piece && S.piece.done)){
    S.piece = pieceNew(P);
    renderPiece();
    return;
  }
  /* 第六案先做案件重演：把四十分钟的站位表排满（GRID 相位） */
  const G = CURRENT_CASE && CURRENT_CASE.GRID;
  if(G && !(S.grid && S.grid.done)){
    S.grid = gridInit();
    renderGrid();
    return;
  }
  setStep(3);
}

/* 最后一层那一颗按钮上写什么：按「收网前还欠哪一步」自动切 */
function nextLabelText(){
  const total = CHAIN.length;
  if(S.chainStep + 1 < total) return "继续 · 追下一层";
  const P = CURRENT_CASE && CURRENT_CASE.PIECE;
  if(P && !(S.piece && S.piece.done)) return "收网前 · 拼上老人的证词";
  const G = CURRENT_CASE && CURRENT_CASE.GRID;
  if(G && !(S.grid && S.grid.done)) return "收网前 · 排一遍这四十分钟";
  return "收网 · 指认主谋";
}

function restart(){
  chTimerStop();
  if(clockTimer) clearInterval(clockTimer);
  hudClock.textContent="00:00";
  hudFill.style.width="0";
  if(CURRENT_CASE) loadCase(CURRENT_CASE.id);
  initState();
  BRIDGE.gameId="s"+Date.now().toString(36);
  setStep(0);
}

/* ============ 启动 ============ */
loadCase("case1");
initState();
FX.hud();
render();
updateCostHUD();
</script>
</body>
