<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>神探张指导</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🕵</text></svg>">
<style>
:root{
  --bg:#080a0f; --bg2:#10141d; --bg3:#171d29; --bg4:#1f2735; --line:#242c3b;
  --fg:#e8eef6; --fg2:#94a3b8; --fg3:#5a6a80;
  --red:#e5484d; --gold:#e8b339; --blue:#4a9eff; --green:#3fb950; --purple:#a371f7;
  --ink:#c9d6e6;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  background:var(--bg);color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:14px;overflow-x:hidden;
  background-image:radial-gradient(circle at 20% 0%,rgba(232,179,57,.045),transparent 45%),radial-gradient(circle at 85% 95%,rgba(74,158,255,.04),transparent 45%);
}
#app{width:100%;max-width:940px}

/* 顶栏 */
.hud{display:flex;align-items:center;gap:9px;margin-bottom:13px;flex-wrap:wrap}
.hud-step{font-size:12px;color:var(--fg3);letter-spacing:1px;font-weight:600}
.hud-bar{flex:1;height:2px;background:var(--bg4);border-radius:2px;overflow:hidden;min-width:50px}
.hud-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--red));width:0;transition:width .5s ease}
.hud-clock{font-size:12px;color:var(--gold);font-variant-numeric:tabular-nums;font-weight:600}
.hud-cost{font-size:10.5px;color:var(--fg3);font-variant-numeric:tabular-nums;padding:3px 8px;border:1px solid var(--line);border-radius:6px;white-space:nowrap}

.card{background:var(--bg2);border:1px solid var(--line);border-radius:15px;padding:24px 22px;box-shadow:0 18px 50px rgba(0,0,0,.55)}
h1{font-size:27px;letter-spacing:3px;font-weight:800;margin-bottom:7px;background:linear-gradient(120deg,#fff,var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sub{color:var(--fg3);font-size:12.5px;letter-spacing:1.5px;margin-bottom:22px}
h2{font-size:17px;margin-bottom:10px;letter-spacing:.5px}
h3{font-size:13px;color:var(--gold);margin-bottom:7px;letter-spacing:.8px;font-weight:600}
p{color:var(--fg2);font-size:13.5px;line-height:1.85}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--bg4);color:var(--fg);border:1px solid var(--line);padding:10px 19px;border-radius:9px;font-size:13.5px;cursor:pointer;font-family:inherit;transition:.18s;font-weight:600}
.btn:hover{border-color:var(--fg3);background:#242e40;transform:translateY(-1px)}
.btn.primary{background:linear-gradient(135deg,var(--gold),#a87d14);border-color:transparent;color:#0d1015;font-weight:800}
.btn.primary:hover{filter:brightness(1.1)}
.btn.red{background:linear-gradient(135deg,var(--red),#a82f32);border-color:transparent;color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:7px 13px;font-size:12.5px}
.btn:disabled{opacity:.32;cursor:not-allowed;transform:none}
.row{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}

/* 嫌疑人席位 */
.suspects{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:12px}
@media(max-width:620px){.suspects{grid-template-columns:repeat(2,1fr);gap:8px}}
.sus{background:var(--bg3);border:1px solid var(--line);border-radius:11px;padding:10px 11px;cursor:pointer;transition:.2s;position:relative;overflow:hidden}
.sus:hover{border-color:var(--fg3);transform:translateY(-2px)}
.sus.active{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 10px 28px rgba(232,179,57,.14)}
.sus.cracked{border-color:rgba(229,72,77,.5)}
.sus-head{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.ava{width:28px;height:28px;border-radius:7px;flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#0b0e14}
.sus-name{font-size:13.5px;font-weight:700;line-height:1.2}
.sus-role{font-size:10px;color:var(--fg3);line-height:1.3;margin-top:1px}
.def-wrap{margin-top:5px}
.def-label{display:flex;justify-content:space-between;font-size:10px;color:var(--fg3);margin-bottom:3px;letter-spacing:.5px}
.def-bar{height:4px;background:var(--bg);border-radius:3px;overflow:hidden}
.def-bar i{display:block;height:100%;border-radius:3px;transition:width .6s cubic-bezier(.4,0,.2,1)}

/* 举证阶段：审讯台紧跟对话框（首屏必达），线索墙收进面板内部 */
#stage.evidence{display:flex;flex-direction:column}
#stage.evidence > h2{order:1}
#stage.evidence > .stage-bar{order:2}
#stage.evidence > .stage-banner{order:3}
#stage.evidence > .suspects{order:4}
#stage.evidence > .dialog{order:5}
#stage.evidence > #askWrap{order:6}
#stage.evidence > #panelWrap{order:7}
#stage.evidence > .row{order:8}
#stage.evidence > .notice{order:9}

/* 审讯台：紧跟对话框，保证在首屏内 */
.ask-desk{margin-top:11px;background:rgba(232,179,57,.045);border:1px solid rgba(232,179,57,.22);border-radius:11px;padding:11px 12px}
.ask-desk.idle{background:var(--bg3);border-color:var(--line)}
.ad-top{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:8px}
.ad-who{font-size:12.5px;font-weight:800;letter-spacing:.5px}
.ad-hint{font-size:11px;color:var(--fg3);line-height:1.5}
.ask-desk .free textarea{background:var(--bg2)}
.act-panel.soft{border-top:none;margin-top:10px;padding:0}
.soft-line{font-size:12px;color:var(--fg3);line-height:1.75;background:var(--bg3);border:1px dashed var(--line);border-radius:10px;padding:11px 13px}
.soft-line b{color:var(--fg2)}

/* 分幕 */
.stage-banner{background:linear-gradient(135deg,rgba(232,179,57,.10),rgba(232,179,57,.02));border:1px solid rgba(232,179,57,.3);border-radius:12px;padding:14px 16px;margin:12px 0}
.stage-banner .sb-n{font-size:14px;font-weight:800;color:var(--gold);letter-spacing:1.5px;margin-bottom:7px}
.stage-banner .sb-b{font-size:12.5px;line-height:1.8;color:var(--fg2)}
.stage-banner .sb-b b{color:var(--gold)}
.stage-banner.final{background:linear-gradient(135deg,rgba(229,72,77,.12),rgba(229,72,77,.02));border-color:rgba(229,72,77,.42)}
.stage-banner.final .sb-n{color:var(--red)}
.stage-banner.final .sb-b b{color:var(--red)}
.stage-bar{display:flex;align-items:center;gap:9px;margin:10px 0 0;font-size:11px;color:var(--fg3);letter-spacing:.5px;flex-wrap:wrap}
.stage-bar .sb-dot{width:100%;height:3px;background:var(--bg);border-radius:2px;overflow:hidden;flex:1;min-width:70px}
.stage-bar .sb-dot i{display:block;height:100%;background:var(--gold);border-radius:2px;transition:width .5s}
.task-line{background:rgba(63,214,138,.05);border:1px solid rgba(63,214,138,.22);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:12px;line-height:1.75;color:var(--fg2)}
.task-line b{color:var(--green)}
.task-line .tl-t{font-size:10.5px;color:var(--green);letter-spacing:1.2px;font-weight:700;margin-bottom:5px}
.task-line .tl-wrong{margin-top:8px;padding:7px 10px;border-radius:8px;background:rgba(232,90,90,.07);
  border-left:3px solid rgba(232,90,90,.45);font-size:11.5px;line-height:1.65;color:var(--fg3)}
.hint-line{margin-top:9px;padding:9px 11px;border-radius:9px;background:rgba(232,179,57,.07);border-left:3px solid rgba(232,179,57,.55);font-size:12px;line-height:1.75;color:var(--fg2)}
.hint-line.strong{background:rgba(232,179,57,.12);border-left-color:var(--gold);color:var(--fg)}
.hint-line.pass{background:rgba(63,214,138,.08);border-left-color:rgba(63,214,138,.6);color:var(--fg2)}
.hint-line.dim{background:rgba(255,255,255,.02);border-left-color:rgba(255,255,255,.12);color:var(--fg3)}
.hint-line.kw{background:rgba(232,179,57,.05);border-left-color:rgba(232,179,57,.4);color:var(--fg3);font-size:11.5px}
.hint-line.kw b{color:var(--gold);font-size:12.5px}
.hint-line.kw.strong b{font-weight:800}

/* ===== 纵向追查链：进度条 ===== */
.chain-bar{display:flex;align-items:center;gap:10px;margin:11px 0 0;padding:9px 12px;
  background:var(--bg3);border:1px solid var(--line);border-radius:11px;flex-wrap:wrap}
.cb-label{font-size:10px;letter-spacing:1.4px;color:var(--fg3);font-weight:700;flex-shrink:0}
.cb-track{display:flex;align-items:center;gap:6px;flex:1;min-width:0;flex-wrap:wrap}
.cb-dot{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:3px 9px;border-radius:20px;
  border:1px solid transparent;white-space:nowrap}
.cb-dot i{width:7px;height:7px;border-radius:50%;display:block;flex-shrink:0}
.cb-dot.done{background:rgba(63,214,138,.09);border-color:rgba(63,214,138,.28);color:var(--fg3)}
.cb-dot.done i{background:var(--green)}
.cb-dot.done b{text-decoration:line-through;opacity:.75}
.cb-dot.now{background:rgba(232,179,57,.13);border-color:rgba(232,179,57,.5);color:var(--gold);font-weight:700}
.cb-dot.now i{background:var(--gold);box-shadow:0 0 8px var(--gold);animation:pulse 1.8s infinite}
.cb-dot.wait{background:rgba(255,255,255,.025);border-color:rgba(255,255,255,.06);color:var(--fg3);opacity:.55}
.cb-dot.wait i{background:var(--fg3)}
.cb-arrow{color:var(--fg3);font-size:11px;opacity:.5}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* ===== 纵向追查链：嫌疑人卡徽标 ===== */
.sus{position:relative}
.sus-badge{position:absolute;top:9px;right:9px;font-size:9.5px;padding:2px 7px;border-radius:5px;letter-spacing:.4px;font-weight:700}
.sus-badge.now{background:rgba(232,179,57,.2);color:var(--gold);border:1px solid rgba(232,179,57,.45)}
.sus-badge.out{background:rgba(255,255,255,.05);color:var(--fg3)}
.sus-badge.lock{background:rgba(255,255,255,.03);color:var(--fg3);opacity:.7}
.sus.retired{opacity:.55}
.sus.retired .sus-name{text-decoration:line-through;text-decoration-color:rgba(255,255,255,.3)}
.sus.lockedp{opacity:.42}

/* ===== 追查动作面板 ===== */
.act-box{border-radius:11px;padding:13px 14px;margin-bottom:14px}
.act-box .ab-t{font-size:12.5px;font-weight:800;letter-spacing:.8px;margin-bottom:7px}
.act-box .ab-b{font-size:12px;line-height:1.8;color:var(--fg2)}
.act-box .ab-b b{color:var(--fg)}
.act-box .btn{margin-top:11px;width:100%}
.act-box.ready{background:rgba(63,214,138,.07);border:1px solid rgba(63,214,138,.32)}
.act-box.ready .ab-t{color:var(--green)}
.act-box.done{background:rgba(232,179,57,.06);border:1px solid rgba(232,179,57,.3)}
.act-box.done .ab-t{color:var(--gold)}
.act-box:not(.ready):not(.done){background:rgba(255,255,255,.02);border:1px solid var(--line)}
.act-box:not(.ready):not(.done) .ab-t{color:var(--fg3)}
.clues.collapsed{max-height:88px;overflow:hidden;position:relative}
.clues.collapsed::after{content:"";position:absolute;left:0;right:0;bottom:0;height:44px;
  background:linear-gradient(transparent,var(--bg));pointer-events:none}

/* ===== 链式收网：指控书 ===== */
.chain-note{margin:16px 0;display:flex;flex-direction:column;gap:0}
.cv-step{position:relative;padding:13px 15px;background:var(--bg3);border:1px solid var(--line);
  border-radius:11px;border-left:3px solid var(--gold)}
.cv-step+.cv-step{margin-top:9px}
.cv-step.done{border-left-color:rgba(63,214,138,.6)}
.cv-who{display:flex;align-items:center;gap:8px;margin-bottom:7px;flex-wrap:wrap}
.cv-who .ava.sm{width:22px;height:22px;font-size:11px;border-radius:6px}
.cv-who b{font-size:13px}
.cv-tag{font-size:10.5px;color:var(--fg3);letter-spacing:.4px}
.cv-ask{font-size:12px;line-height:1.7;color:var(--fg2);font-style:italic}
.cv-link{margin-top:9px;padding-top:9px;border-top:1px dashed rgba(255,255,255,.08);
  display:flex;flex-direction:column;gap:4px}
.cv-act{font-size:11.5px;color:var(--green);font-weight:700}
.cv-arrow{color:var(--fg3);font-size:11px;line-height:1}
.cv-out{font-size:11px;color:var(--fg3);line-height:1.6}

/* 对话框 */
.dialog{background:var(--bg3);border:1px solid var(--line);border-radius:13px;padding:13px 14px;margin-top:11px;min-height:86px}
.dlg-head{display:flex;align-items:center;gap:9px;margin-bottom:11px;padding-bottom:11px;border-bottom:1px solid var(--line)}
.dlg-text{font-size:14px;line-height:1.9;color:var(--ink)}
.dlg-text .em{color:var(--gold);font-weight:700}
.dlg-text .bad{color:var(--red);font-weight:700}
.stage-dir{font-size:12.5px;color:var(--fg3);font-style:italic;margin-top:9px;line-height:1.75}

/* ============ 演技层：靠排版和节奏演，不做注释 ============
   设计原则：不给标签、不下结论。玩家该自己从"字怎么排的"里读出他在瞒什么。
   所有效果都必须是纯视觉的，一眼能感觉到，但说不出规则。 */

/* 卡住 —— 句中断开，留一段可见的空白。玩家能自己数出这一拍 */
.act-gap{display:inline-block;width:32px;height:1px;vertical-align:middle;
  position:relative;top:-1px}
.act-gap.sm{width:16px}

/* 吞回去 —— 后半句淡下去、字变小，像声音低了下去 */
.act-fade{opacity:.35;font-size:.9em;letter-spacing:.3px}

/* 反问 —— 整句变暗，像把话轻轻推回来 */
.act-defl{color:var(--fg3);font-style:italic}

/* 沉默 —— 更暗、字距松，读起来更慢 */
.act-sil{color:var(--fg3);letter-spacing:.8px;opacity:.85}

/* 抢答：行距收紧，读起来更急 */
.dlg-text:has(.act-rush){letter-spacing:-.15px;line-height:1.75}

/* 证据袋 */
.clues{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:11px}
.clue{background:var(--bg3);border:1px solid var(--line);border-radius:9px;padding:9px 10px;cursor:pointer;transition:.18s;position:relative}
.clue:hover{border-color:var(--gold);transform:translateY(-1px)}
.clue.sel{border-color:var(--gold);background:rgba(232,179,57,.08);box-shadow:0 0 0 1px var(--gold)}
.clue.locked{opacity:.42;cursor:default;pointer-events:none}
.c-id{font-size:10px;color:var(--fg3);letter-spacing:1px;font-variant-numeric:tabular-nums}
.c-t{font-size:12.5px;font-weight:700;margin:0 0 4px;line-height:1.4;padding-right:44px}
.c-b{font-size:11px;color:var(--fg3);line-height:1.55}
.clue.sel .c-b{color:var(--fg2)}
.clue.on{border-color:rgba(63,214,138,.55)}
.c-badge-inline{position:absolute;top:9px;right:9px;font-size:9.5px;padding:1px 6px;border-radius:5px;letter-spacing:.4px}
.c-badge-inline.off{background:rgba(255,255,255,.05);color:var(--fg3)}
.c-badge-inline.on{background:rgba(63,214,138,.16);color:var(--green)}
.bag-toggle{margin-top:11px;width:100%;background:transparent;border:1px dashed var(--line);
  color:var(--fg3);border-radius:9px;padding:8px;font-size:11.5px;cursor:pointer;font-family:inherit;transition:.18s}
.bag-toggle:hover{border-color:var(--gold);color:var(--gold)}
.bag-hint{margin:-4px 0 10px;font-size:11.5px;color:var(--fg3);line-height:1.6}
.clue.on.sel{border-color:var(--green);box-shadow:0 0 0 1px var(--green)}
.c-badge{position:absolute;top:9px;right:9px;font-size:9.5px;padding:2px 6px;border-radius:20px;letter-spacing:.4px;font-weight:700}
.c-badge.on{color:var(--green);background:rgba(63,214,138,.14);border:1px solid rgba(63,214,138,.4)}
.c-badge.off{color:var(--fg3);background:rgba(255,255,255,.04);border:1px solid var(--line)}

/* 辩词破绽提示 */
.plea-hint{margin-top:12px;padding:12px 14px;border-radius:10px;background:rgba(232,179,57,.06);border:1px solid rgba(232,179,57,.28)}
.ph-t{font-size:10.5px;color:var(--gold);letter-spacing:1.2px;font-weight:700;margin-bottom:7px}
.ph-w{font-size:12.5px;color:var(--fg);line-height:1.65}
.ph-tip{margin-top:9px;padding-top:9px;border-top:1px dashed rgba(232,179,57,.25);font-size:12px;color:var(--gold);line-height:1.6}

/* 案件选择卡 */
.case-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin:0 0 18px}
.case-card{background:var(--bg3);border:1px solid var(--line);border-radius:12px;padding:16px 18px;cursor:pointer;transition:.2s;position:relative;overflow:hidden}
.case-card:hover{border-color:var(--gold);transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.3)}
.case-card:hover .cc-go{color:var(--gold)}
.cc-tag{font-size:10.5px;color:var(--fg3);letter-spacing:1.2px;margin-bottom:8px}
.cc-title{font-size:17px;font-weight:800;color:var(--ink);margin-bottom:10px;letter-spacing:.5px}
.cc-body{font-size:12.5px;color:var(--fg3);line-height:1.75}
.cc-go{margin-top:14px;font-size:12px;color:var(--fg3);font-weight:700;transition:.2s}

/* 质疑面板 */
.act-panel{margin-top:14px;border-top:1px solid var(--line);padding-top:15px}
.chain{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--fg3);margin-bottom:12px}
.chain b{color:var(--gold);font-weight:700}
.chain .slot{background:var(--bg3);border:1px dashed var(--line);border-radius:7px;padding:5px 11px;color:var(--fg2);font-size:12.5px}
.chain .slot.filled{border-style:solid;border-color:var(--gold);color:var(--gold)}
.free textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:9px;color:var(--fg);font-family:inherit;font-size:13.5px;line-height:1.65;padding:11px 13px;resize:vertical;outline:none;transition:.18s}
.free textarea:focus{border-color:var(--gold)}
.free textarea:disabled{opacity:.4;cursor:not-allowed}
.free-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}

/* 反馈 */
.fb{margin-top:13px;border-radius:10px;padding:12px 15px;font-size:13px;line-height:1.8;border:1px solid;animation:pop .35s ease}
@keyframes pop{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.fb.hit{border-color:rgba(63,185,80,.45);background:rgba(63,185,80,.08);color:#a8e6b8}
.fb.mid{border-color:rgba(232,179,57,.45);background:rgba(232,179,57,.08);color:#f0d494}
.fb.miss{border-color:rgba(148,163,184,.35);background:rgba(148,163,184,.06);color:var(--fg2)}
.fb.crack{border-color:rgba(229,72,77,.5);background:rgba(229,72,77,.1);color:#f5a9ab}
/* 挨着了：方向对但没问透。金色，比 miss 亮，比 hit 弱 */
.fb.soft{border-color:rgba(232,179,57,.35);background:rgba(232,179,57,.05);color:var(--fg2)}
/* 泛问：问法没用。暗的，但要明确 */
.fb.vague{border-color:rgba(148,163,184,.22);background:rgba(148,163,184,.03);color:var(--fg3)}
.fb b{font-weight:800}

/* 连击提示 */
.combo{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:34px;font-weight:900;letter-spacing:4px;color:var(--gold);text-shadow:0 0 30px rgba(232,179,57,.6);pointer-events:none;animation:comboAnim 1.4s ease forwards;z-index:99}
@keyframes comboAnim{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}75%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.15)}}

/* 指认 */
.pick{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
@media(max-width:620px){.pick{grid-template-columns:1fr}}
.pick-btn{background:var(--bg3);border:1px solid var(--line);border-radius:11px;padding:15px;cursor:pointer;text-align:left;color:var(--fg);font-family:inherit;transition:.2s}
.pick-btn:hover{border-color:var(--red);background:rgba(229,72,77,.07);transform:translateY(-2px)}
.pick-btn b{font-size:15px;display:block;margin-bottom:3px}
.pick-btn span{font-size:12px;color:var(--fg3)}
.pick-btn .mini{font-size:11px;color:var(--fg3);margin-top:7px;font-variant-numeric:tabular-nums}

/* 复盘 */
.verdict{background:linear-gradient(135deg,rgba(229,72,77,.1),rgba(232,179,57,.06));border:1px solid rgba(229,72,77,.35);border-radius:12px;padding:17px;margin-bottom:15px}
.verdict .who{font-size:21px;font-weight:800;color:var(--red);letter-spacing:1.5px}
.step-list{counter-reset:s;list-style:none}
.step-list li{counter-increment:s;position:relative;padding-left:32px;margin-bottom:11px;color:var(--fg2);font-size:13px;line-height:1.8}
.step-list li::before{content:counter(s);position:absolute;left:0;top:1px;width:21px;height:21px;background:var(--bg3);border:1px solid var(--line);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--gold);font-variant-numeric:tabular-nums}
.law{background:rgba(74,158,255,.07);border:1px solid rgba(74,158,255,.28);border-radius:10px;padding:13px 15px;margin-top:8px}
.law h3{color:var(--blue)}
.law code{background:var(--bg);padding:1px 6px;border-radius:4px;font-size:12px;color:var(--blue);font-family:ui-monospace,monospace}
.notice{font-size:12.5px;color:var(--fg3);background:var(--bg3);border-radius:8px;padding:11px 14px;margin-top:14px;line-height:1.75;border-left:2px solid var(--line)}
ul.clean{list-style:none}
ul.clean li{color:var(--fg2);font-size:13px;line-height:1.8;padding-left:15px;position:relative;margin-bottom:4px}
ul.clean li::before{content:"—";position:absolute;left:0;color:var(--fg3)}
.score-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(115px,1fr));gap:11px;margin:14px 0}
.score-grid div{background:var(--bg3);border:1px solid var(--line);border-radius:10px;padding:13px}
.score-grid .n{font-size:23px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.score-grid .l{font-size:11px;color:var(--fg3);margin-top:3px}
.hidden{display:none}
.typing{display:inline-flex;gap:4px}
.typing i{width:5px;height:5px;border-radius:50%;background:var(--fg3);animation:bl 1.3s infinite}
.typing i:nth-child(2){animation-delay:.2s}
.typing i:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}

/* ===== 选项模式（可控问话）：每层四选一 ===== */
#stage.evidence > .ch-head{order:1}
#stage.evidence > .ch-opts{order:5}
#stage.evidence > .ch-fb{order:6}
#stage.evidence > .ch-hint{order:7}

.ch-head{margin:2px 0 0}
.ch-row{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--fg3)}
.ch-n b{color:var(--gold);font-size:13.5px}
.ch-tag{color:var(--fg2);border-left:1px solid var(--line);padding-left:10px}
.ch-wrong{margin-left:auto;color:var(--red);background:rgba(229,72,77,.1);
  border:1px solid rgba(229,72,77,.3);border-radius:999px;padding:1px 9px;font-size:11px}
.ch-track{height:4px;border-radius:999px;background:var(--bg3);margin-top:9px;overflow:hidden}
.ch-track i{display:block;height:100%;border-radius:999px;
  background:linear-gradient(90deg,var(--gold),#f0cf7a);transition:width .35s ease}

.ch-opts{display:flex;flex-direction:column;gap:9px;margin-top:13px}
.ch-lead{font-size:11.5px;color:var(--fg3);letter-spacing:1px}
.opt{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;
  padding:13px 15px;border-radius:11px;border:1px solid var(--line);
  background:linear-gradient(180deg,rgba(31,39,53,.9),rgba(23,29,41,.9));
  color:var(--fg);font-size:13.5px;line-height:1.6;font-family:inherit;cursor:pointer;
  transition:transform .14s,border-color .14s,box-shadow .14s}
.opt:hover{border-color:var(--gold);transform:translateX(4px);
  box-shadow:0 6px 20px rgba(0,0,0,.35),inset 0 0 0 1px rgba(232,179,57,.16)}
.opt-k{flex:0 0 23px;height:23px;border-radius:7px;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--gold);
  font-size:11.5px;font-weight:700;font-style:normal}
.opt-t{flex:1}
.opt.done{opacity:.4;cursor:default;transform:none;box-shadow:none}
.opt.done .opt-k{color:var(--red);border-color:rgba(229,72,77,.35)}
.opt.good{border-color:var(--green);
  background:linear-gradient(180deg,rgba(63,185,80,.13),rgba(23,29,41,.9))}
.opt.good .opt-k{color:var(--green);border-color:rgba(63,185,80,.45)}
.opt.bad{border-color:rgba(229,72,77,.55);
  background:linear-gradient(180deg,rgba(229,72,77,.1),rgba(23,29,41,.9))}

.ch-fb{margin-top:12px;border-radius:11px;padding:13px 15px;border:1px solid var(--line);
  background:rgba(255,255,255,.025);animation:pop .3s ease}
.ch-fb.good{border-color:rgba(63,185,80,.42);background:rgba(63,185,80,.06)}
.ch-fb.bad{border-color:rgba(229,72,77,.34);background:rgba(229,72,77,.05)}
.ch-fb.alt{border-color:rgba(163,113,247,.36);background:rgba(163,113,247,.06)}
.ch-fb.alt .fb-badge{color:var(--purple);border-color:rgba(163,113,247,.45);background:rgba(163,113,247,.12)}
.fb-h{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.fb-badge{font-size:11px;padding:2px 9px;border-radius:999px;
  border:1px solid var(--line);color:var(--fg2)}
.ch-fb.good .fb-badge{color:var(--green);border-color:rgba(63,185,80,.45);background:rgba(63,185,80,.12)}
.ch-fb.bad .fb-badge{color:var(--red);border-color:rgba(229,72,77,.4);background:rgba(229,72,77,.1)}
.mentor{font-size:13px;line-height:1.75;color:var(--fg2);
  border-left:3px solid var(--gold);padding:2px 0 2px 11px;margin-top:4px}
.mentor b{color:var(--gold)}
.fb-note{margin-top:9px;font-size:12px;color:var(--green);background:rgba(63,185,80,.07);
  border:1px dashed rgba(63,185,80,.3);border-radius:9px;padding:8px 11px}
.ch-hint{margin-top:11px;font-size:12.5px;line-height:1.7;color:var(--gold);
  background:rgba(232,179,57,.07);border:1px dashed rgba(232,179,57,.35);
  border-radius:10px;padding:10px 13px}

/* ===== 演出层：抉择倒计时 ===== */
#stage.evidence > .ch-timer-wrap{order:4}
.ch-timer{margin-top:13px;display:flex;align-items:center;gap:9px;font-size:11.5px;color:var(--fg3)}
.ch-timer .tnum{margin-left:auto;color:var(--gold);font-variant-numeric:tabular-nums;
  font-size:12px;letter-spacing:0}
.ch-timer.hot .tnum{color:var(--red)}
.ch-tbar{height:3px;border-radius:999px;background:var(--bg3);margin-top:7px;overflow:hidden}
.ch-tbar i{display:block;height:100%;border-radius:999px;background:var(--gold);
  transition:width .2s linear,background .3s}
.ch-tbar.hot i{background:var(--red)}

/* ===== 演出层：收网过场 ===== */
.cv-curtain{position:fixed;inset:0;z-index:99;display:flex;align-items:center;justify-content:center;
  background:rgba(5,7,11,.93);pointer-events:none;
  animation:cvCurtain 1.3s ease forwards}
.cv-curtain b{font-size:21px;letter-spacing:6px;color:var(--gold);font-weight:400}
@keyframes cvCurtain{0%,52%{opacity:1}100%{opacity:0}}
.cv-curtain.cv-strike{background:rgba(19,6,8,.95);animation:cvStrike 2.4s ease forwards}
.cv-curtain.cv-strike b{font-size:33px;letter-spacing:4px;color:var(--red)}
@keyframes cvStrike{0%{opacity:0}12%{opacity:1}68%{opacity:1}100%{opacity:0}}
@keyframes cvIn{from{opacity:0;transform:translateY(11px)}to{opacity:1;transform:none}}
.cv-step{animation:cvIn .5s cubic-bezier(.2,.9,.3,1) both}

/* ===== 现场勘察（每层第一步：场景图 + 画面热区点线索） ===== */
#stage.evidence > .sv-stage{order:2}
#stage.evidence > .sv-lead{order:3}
#stage.evidence > .sv-list{order:4}
#stage.evidence > .sv-body{order:5}
#stage.evidence > .sv-done{order:7}
#stage.evidence > .ev-bar{order:3}

.sv-stage{margin-top:12px;border:1px solid var(--line);border-radius:13px;overflow:hidden;
  background:#05070b;box-shadow:0 14px 40px rgba(0,0,0,.5)}
.sv-frame{position:relative;width:min(100%,74vh);aspect-ratio:1400/853;margin:0 auto;line-height:0}
.sv-frame img{width:100%;height:100%;object-fit:cover;display:block;
  filter:saturate(.9) contrast(1.05)}
.sv-frame::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(126% 94% at 50% 38%,transparent 38%,rgba(5,7,11,.62) 100%)}

.sv-spot{position:absolute;transform:translate(-50%,-50%);width:36px;height:36px;
  border:0;background:none;padding:0;cursor:pointer;
  display:flex;align-items:center;justify-content:center}
.sv-spot i{position:absolute;width:30px;height:30px;border-radius:50%;
  border:1.5px solid rgba(232,179,57,.85);background:rgba(232,179,57,.13);
  animation:svPulse 2.2s ease-out infinite}
.sv-spot i::after{content:"";position:absolute;left:50%;top:50%;width:7px;height:7px;
  border-radius:50%;background:var(--gold);transform:translate(-50%,-50%)}
@keyframes svPulse{0%{box-shadow:0 0 0 0 rgba(232,179,57,.45)}
  70%{box-shadow:0 0 0 15px rgba(232,179,57,0)}
  100%{box-shadow:0 0 0 0 rgba(232,179,57,0)}}
.sv-spot b{position:absolute;left:50%;top:-30px;transform:translateX(-50%);white-space:nowrap;
  font-size:11.5px;font-weight:400;color:var(--fg);background:rgba(8,11,17,.94);
  border:1px solid var(--line);border-radius:7px;padding:3px 9px;
  opacity:0;transition:opacity .16s;pointer-events:none}
.sv-spot:hover b,.sv-spot:focus b{opacity:1}
.sv-spot:hover i{border-color:var(--gold);background:rgba(232,179,57,.26)}
.sv-spot.seen i{border-color:rgba(232,179,57,.45);background:rgba(232,179,57,.05)}
.sv-spot.seen i::after{background:rgba(232,179,57,.7)}
.sv-spot.hit i{border-color:var(--red);background:rgba(229,72,77,.18);
  animation:none;box-shadow:0 0 0 5px rgba(229,72,77,.13)}
.sv-spot.hit i::after{background:var(--red)}
.sv-spot.now i{border-color:#fff;background:rgba(255,255,255,.2)}

.sv-lead{margin-top:15px;display:flex;align-items:center;gap:8px;
  font-size:12px;color:var(--fg3);letter-spacing:.8px}
.sv-count{margin-left:auto;color:var(--fg3);font-variant-numeric:tabular-nums;letter-spacing:0}

.sv-list{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px}
.sv-chip{font-size:11.5px;color:var(--fg2);background:rgba(255,255,255,.035);
  border:1px solid var(--line);border-radius:999px;padding:3px 10px;cursor:pointer;font-family:inherit;
  transition:border-color .14s,color .14s}
.sv-chip:hover{border-color:var(--gold);color:var(--fg)}
.sv-chip.seen{color:var(--fg3);opacity:.55}
.sv-chip.hit{color:var(--red);border-color:rgba(229,72,77,.45)}

.sv-body{margin-top:12px;border-radius:11px;padding:14px 15px;
  border:1px solid var(--line);background:rgba(255,255,255,.025);animation:pop .3s ease}
.sv-body.hit{border-color:rgba(229,72,77,.4);background:rgba(229,72,77,.05)}
.sv-h{display:flex;align-items:center;gap:9px;margin-bottom:9px;font-size:13px;flex-wrap:wrap}
.sv-h b{color:var(--fg);font-size:13.5px}
.sv-tag{font-size:10.5px;border-radius:999px;padding:2px 9px;border:1px solid var(--line);color:var(--fg3)}
.sv-tag.key{color:var(--red);border-color:rgba(229,72,77,.45);background:rgba(229,72,77,.1)}
.sv-tag.nor{color:var(--fg3)}
.sv-react{font-size:12.5px;line-height:1.8;color:var(--gold);margin-bottom:9px;
  border-left:2px solid rgba(232,179,57,.45);padding-left:10px}
.sv-read{font-size:13.5px;line-height:1.95;color:var(--fg2)}
.sv-flag{margin-top:10px;font-size:12.5px;line-height:1.7;color:var(--red);
  background:rgba(229,72,77,.09);border:1px dashed rgba(229,72,77,.36);
  border-radius:9px;padding:8px 11px}
.sv-gain{margin-top:9px;font-size:12px;color:var(--green);
  background:rgba(63,185,80,.07);border:1px dashed rgba(63,185,80,.3);
  border-radius:9px;padding:8px 11px}

.sv-done{margin-top:16px;border-radius:10px;padding:12px 14px;background:var(--bg3);
  border-left:2px solid var(--green);font-size:12.5px;line-height:1.8;color:var(--fg2)}
.sv-done .btn{margin-top:12px}

.ev-bar{margin-top:11px;display:flex;flex-wrap:wrap;align-items:center;gap:6px;
  font-size:11.5px;color:var(--fg3)}
.ev-chip{color:var(--green);background:rgba(63,185,80,.08);
  border:1px solid rgba(63,185,80,.28);border-radius:999px;padding:2px 9px;font-size:11.5px}

/* ===== 三拍审讯：弹药库 / 摊证据 / 抓破绽 / 警戒值 ===== */
#stage.evidence > .arm-box{order:5}
#stage.evidence > .crack-box{order:5}

.alarm-wrap{margin-top:10px;display:flex;align-items:center;gap:9px;font-size:11.5px;color:var(--fg3)}
.alarm-wrap b{color:var(--fg2);font-weight:600;font-variant-numeric:tabular-nums}
.alarm-bar{flex:1;height:5px;border-radius:999px;background:rgba(255,255,255,.07);overflow:hidden}
.alarm-bar i{display:block;height:100%;border-radius:999px;background:var(--gold);
  transition:width .35s ease,background .35s ease}
.alarm-wrap.hot .alarm-bar i{background:var(--red)}
.alarm-wrap.hot b{color:var(--red)}

.arm-box,.crack-box{margin-top:13px;border:1px solid var(--line);border-radius:12px;padding:13px 14px;
  background:linear-gradient(180deg,rgba(31,39,53,.9),rgba(20,26,37,.92));animation:pop .3s ease}
.box-h{display:flex;align-items:center;gap:9px;margin-bottom:11px;flex-wrap:wrap}
.box-h .bx-tag{font-size:11px;letter-spacing:.6px;color:var(--gold);
  background:rgba(232,179,57,.1);border:1px solid rgba(232,179,57,.3);border-radius:999px;padding:2px 9px}
.box-h .bx-tag.red{color:var(--red);background:rgba(229,72,77,.1);border-color:rgba(229,72,77,.32)}
.bx-tag.purple{color:var(--purple);background:rgba(163,113,247,.1);border-color:rgba(163,113,247,.32)}
.rd-tell{margin-top:9px;font-size:11.5px;color:var(--purple);border-left:2px solid var(--purple);padding-left:9px;line-height:1.7}

/* 案件重演网格（第六案 · P3） */
.gd-wrap{overflow-x:auto;margin-top:12px;padding-bottom:4px}
.gd-table{width:100%;min-width:420px;border-collapse:separate;border-spacing:5px}
.gd-table th{font-size:11px;color:var(--fg3);font-weight:600;letter-spacing:.5px;padding:0 2px 5px;white-space:nowrap;text-align:center}
.gd-table th.gd-p{text-align:right;padding-right:8px;width:74px;font-size:12px}
.gd-cell{height:44px;border-radius:9px;border:1px solid var(--line);background:var(--bg3);
  font-size:12.5px;color:var(--fg2);text-align:center;vertical-align:middle;position:relative;transition:.14s}
.gd-cell.fx{border-color:rgba(232,179,57,.34);background:rgba(232,179,57,.07);color:var(--gold)}
.gd-cell.empty{cursor:pointer}
.gd-cell.empty:hover{border-color:var(--blue);color:var(--fg)}
.gd-cell.sel{border-color:var(--blue);background:rgba(74,158,255,.13);color:var(--fg);box-shadow:0 0 0 2px rgba(74,158,255,.16)}
.gd-cell.ok{border-color:rgba(63,185,80,.45);background:rgba(63,185,80,.1);color:var(--fg)}
.gd-cell.no{animation:pcShake .34s ease;border-color:rgba(229,72,77,.6)}
.gd-cell .gd-q{color:var(--fg3);font-size:15px}
.gd-cell .gd-x{position:absolute;right:3px;top:1px;font-size:8.5px;color:var(--red);opacity:.75}
.gd-pal{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px}
.gd-pl{padding:8px 13px;border-radius:9px;border:1px solid var(--line);background:var(--bg3);color:var(--fg2);font-size:12.5px;cursor:pointer;transition:.14s}
.gd-pl:hover{border-color:var(--blue);color:var(--fg)}
.gd-pl.dead{opacity:.38;cursor:not-allowed;text-decoration:line-through}
.gd-src{font-size:12.5px;color:var(--fg2);line-height:1.9;border-left:2px solid var(--gold);padding-left:10px;margin-top:6px}
.gd-legend{font-size:11.5px;color:var(--fg3);margin-top:9px;line-height:1.7}
.box-h .bx-sub{font-size:11.5px;color:var(--fg3)}

.arm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.arm-item{display:flex;flex-direction:column;gap:4px;text-align:left;padding:10px 12px;border-radius:10px;
  border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--fg);font-size:13px;
  font-family:inherit;cursor:pointer;transition:transform .14s,border-color .14s,background .14s}
.arm-item:hover{border-color:var(--gold);transform:translateY(-2px)}
.arm-item.sel{border-color:var(--gold);background:rgba(232,179,57,.1);
  box-shadow:inset 0 0 0 1px rgba(232,179,57,.32)}
.arm-item.dead{opacity:.32;cursor:not-allowed}
.arm-item.dead:hover{transform:none;border-color:var(--line)}
.arm-item.dead .arm-t{text-decoration:line-through}
.arm-t{font-weight:600;line-height:1.4}
.arm-b{font-size:11.5px;line-height:1.6;color:var(--fg3)}

.crack-list{display:flex;flex-direction:column;gap:8px}
.crack-item{text-align:left;padding:11px 13px;border-radius:10px;border:1px solid var(--line);
  background:rgba(255,255,255,.03);color:var(--fg2);font-size:13.5px;line-height:1.7;
  font-family:inherit;cursor:pointer;transition:.14s}
.crack-item:hover{border-color:var(--red);color:var(--fg)}
.crack-item.ok{border-color:rgba(63,185,80,.55);background:rgba(63,185,80,.1);color:var(--fg)}
.crack-item.no{border-color:rgba(229,72,77,.5);background:rgba(229,72,77,.09)}
.crack-item.locked{opacity:.42;cursor:not-allowed}
.crack-item.locked:hover{border-color:var(--line);color:var(--fg2)}
.crack-item i{font-style:normal;color:var(--fg3);margin-right:8px;font-size:11.5px}
.reply-quote{margin-bottom:11px;padding:11px 13px;border-radius:10px;background:rgba(255,255,255,.035);
  border-left:2px solid var(--gold);font-size:13.5px;line-height:1.85;color:var(--fg2)}
.reply-quote.dead{border-left-color:var(--red)}

/* ===== 拼证词（第四案收网前） ===== */
.pc-frags{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.pc-frag{text-align:left;padding:10px 12px;border-radius:10px;border:1px solid var(--line);
  background:rgba(255,255,255,.03);color:var(--fg2);font-size:12.5px;line-height:1.65;
  font-family:inherit;cursor:pointer;transition:.14s}
.pc-frag:hover{border-color:var(--gold);color:var(--fg)}
.pc-frag.sel{border-color:var(--gold);background:rgba(232,179,57,.12);color:var(--fg)}
.pc-frag-x{margin-left:7px;font-size:10.5px;color:var(--red);opacity:.8;vertical-align:middle}
@keyframes pcShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-4px)}45%{transform:translateX(4px)}70%{transform:translateX(-2px)}}
.pc-slot.shake{animation:pcShake .34s ease;border-color:rgba(229,72,77,.55)}
.vc-list{display:flex;flex-direction:column;gap:8px;margin:10px 0 4px}
.vc-item{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:11px 13px;border-radius:10px;
  border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--fg2);font-size:12.5px;
  line-height:1.7;font-family:inherit;cursor:pointer;transition:.14s}
.vc-item:hover{border-color:var(--gold);color:var(--fg)}
.vc-item.no{border-color:rgba(229,72,77,.5);background:rgba(229,72,77,.07)}
.vc-k{flex:none;width:17px;height:17px;border-radius:5px;border:1px solid var(--line);

.vc-t{flex:1}
.rp-list{display:flex;flex-direction:column;gap:7px;margin-top:10px}

  border-left:3px solid var(--line)}

.rp-who{font-weight:600}
.rp-tag2{font-size:11px;color:var(--fg3);opacity:.85}
.rp-res{margin-left:auto;font-size:11px;padding:1px 8px;border-radius:20px;border:1px solid var(--line);color:var(--fg3);white-space:nowrap}

.rp-res.bad{color:var(--red);border-color:rgba(229,72,77,.42)}
.rp-b{margin-top:5px;font-size:11.5px;color:var(--fg3);line-height:1.65}

.pc-slot.ok .pc-slot-t{color:var(--fg)}

/* ===== 收网评级 ===== */
.grade{display:flex;gap:15px;align-items:flex-start;margin-top:15px;padding:15px 16px;
  border:1px solid var(--line);border-radius:12px}
.grade-letter{font-size:46px;font-weight:800;line-height:.95;letter-spacing:-2px;
  font-variant-numeric:tabular-nums}
.grade-body{flex:1;min-width:0}
.grade-name{font-size:14px;font-weight:700;margin-bottom:6px;letter-spacing:1.5px}
.grade-line{font-size:13px;line-height:1.85;color:var(--fg2)}
.grade-meta{margin-top:10px;font-size:11.5px;color:var(--fg3);font-variant-numeric:tabular-nums}
.grade-tip{margin-top:6px;font-size:11.5px;color:var(--fg3)}
.grade-mini{display:flex;align-items:center;gap:9px;margin-top:12px;padding:9px 12px;
  border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.025);
  font-size:12.5px;color:var(--fg2)}
.grade-mini b{font-size:15px;font-weight:800;letter-spacing:-.5px}

/* ===== 场景与立绘（AVG 演出层） ===== */
.scene{position:relative;height:clamp(230px,38vh,370px);border-radius:14px 14px 0 0;overflow:hidden;
  border:1px solid var(--line);border-bottom:none;margin-top:12px;
  background-color:var(--bg3);background-position:center;background-size:cover;background-repeat:no-repeat;
  box-shadow:inset 0 0 70px rgba(0,0,0,.78)}
.scene::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(8,10,15,.34) 0%,rgba(8,10,15,.04) 30%,rgba(8,10,15,.66) 76%,rgba(8,10,15,.95) 100%)}
.scene-char{position:absolute;right:2.5%;bottom:0;height:97%;aspect-ratio:820/1160;min-width:120px;max-width:64%;
  filter:drop-shadow(-18px 10px 32px rgba(0,0,0,.75));
  transition:transform .5s cubic-bezier(.22,.9,.28,1),filter .5s ease,opacity .25s ease}
/* 立绘容器：静图与动态立绘共用一套结构。有视频就播视频，没有就还看静图。 */
.scene-char>img,.scene-char>video{width:100%;height:100%;object-fit:contain;object-position:bottom;
  display:block;pointer-events:none;animation:scZoom .85s cubic-bezier(.2,.9,.3,1) both}
@keyframes scZoom{from{transform:scale(1.09)}to{transform:scale(1)}}
/* 对方的反应：问错了，他前倾逼近；问对了，他后仰靠回椅背。 */
.scene.react-bad  .scene-char{transform:scale(1.05) translateY(.8%);
  filter:drop-shadow(-18px 10px 32px rgba(0,0,0,.75)) saturate(.72) contrast(1.08)}
.scene.react-good .scene-char{transform:scale(.972) translateY(1.5%);
  filter:drop-shadow(-18px 10px 32px rgba(0,0,0,.75)) saturate(1.07) brightness(1.02)}
.scene.react-mid  .scene-char{transform:scale(1.015)}
/* 整图剧照模式：一张成图铺满，不再叠立绘。反应交给镜头语言——
   push 推近（他压过来）/ hit 急推顿住（这句戳到了）/ pull 拉远（他往后靠）/
   pan 横移（他躲了一下）/ hold 定住（只有呼吸感）。 */
.scene.full{height:clamp(240px,42vh,420px)}
.scene.full .scene-char{display:none}
.scene-shot{position:absolute;inset:0;overflow:hidden;
  transform-origin:60% 42%;will-change:transform;
  transition:transform 1.15s cubic-bezier(.3,.85,.3,1),filter 1s ease}
.scene-shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  object-position:var(--pos,50% 42%);
  transform:scale(var(--z,1));transform-origin:var(--org,50% 50%);
  transition:transform .55s cubic-bezier(.25,.8,.3,1)}
.scene.full.react-push .scene-shot{transform:scale(1.075) translateY(.6%);filter:saturate(.74) contrast(1.1)}
.scene.full.react-hit  .scene-shot{transform:scale(1.115) translateY(-.4%);filter:saturate(1.1) brightness(1.03) contrast(1.06);
  transition:transform .5s cubic-bezier(.16,.9,.3,1),filter .5s ease}
.scene.full.react-pull .scene-shot{transform:scale(.955) translateY(.9%);filter:saturate(1.04) brightness(1.03)}
.scene.full.react-pan  .scene-shot{transform:scale(1.04) translateX(-1.6%);filter:saturate(.88)}
.scene.full.react-hold .scene-shot{transform:scale(1.02)}
.scene.shotcut .scene-shot img{animation:shotIn .5s cubic-bezier(.3,.85,.3,1)}
@keyframes shotIn{0%{transform:scale(calc(var(--z,1) * 1.055));opacity:0}
  55%{opacity:1}
  100%{transform:scale(var(--z,1));opacity:1}}
@media (prefers-reduced-motion: reduce){
  .scene-shot{transition:none}
  .scene-shot img{transition:none}
  .scene.full .scene-shot{transform:scale(1.01)!important}
  .scene.shotcut .scene-shot img{animation:none}
}
@keyframes scShake{0%,100%{transform:translateX(0)}
  18%{transform:translateX(-6px)}38%{transform:translateX(5px)}
  58%{transform:translateX(-3px)}78%{transform:translateX(2px)}}
.scene.shake{animation:scShake .45s ease}
.scene-badge{position:absolute;left:14px;bottom:12px;z-index:2;display:flex;align-items:center;gap:9px;
  padding:5px 13px 5px 5px;border-radius:999px;background:rgba(8,10,15,.74);
  border:1px solid rgba(255,255,255,.11)}
.scene-badge img{width:34px;height:34px;border-radius:50%;object-fit:cover;display:block}
.scene-badge b{font-size:13.5px}
.scene-badge span{font-size:10.5px;color:var(--fg3);display:block;margin-top:1px}
.dialog.attached{margin-top:-1px;border-radius:0 0 13px 13px;background:linear-gradient(180deg,rgba(23,29,41,.97),var(--bg3))}
/* #stage.evidence 是 flex 列，子元素靠 order 排布；这里把场景层插进正确位置。
   只在有立绘的案件（.arton）改动顺序，没有美术的案件保持原样。 */
#stage.evidence > .chain-bar{order:0}
#stage.evidence.arton > .scene{order:2}
#stage.evidence.arton > .dialog{order:4}
#stage.evidence.arton > .suspects{order:5}
/* 序章封面：让首页第一屏就有画面，不再是一页纯文字 */
.hero{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:16px;
  display:flex;flex-direction:column;justify-content:flex-end;
  min-height:clamp(170px,26vh,240px);padding:44px 26px 26px;margin:2px 0 14px;
  background-color:#0d1118;background-position:center 42%;background-size:cover;background-repeat:no-repeat;
  box-shadow:inset 0 0 90px rgba(0,0,0,.82),0 12px 34px rgba(0,0,0,.42)}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(8,10,15,.66) 0%,rgba(8,10,15,.30) 44%,rgba(8,10,15,.92) 100%)}
.hero>*{position:relative;z-index:1}
.hero h1{margin:0}
.hero .sub{margin-top:9px}

/* 头像改用立绘 */
.ava{position:relative;overflow:hidden}
.ava img{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block}
.ava>span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.sus .ava{width:34px;height:34px;border-radius:9px}
.dlg-head .ava{width:36px;height:36px;border-radius:10px}

/* ===== 翻旧账 · 谎言台账 ===== */
#stage.evidence > .scold-cast{order:4}
#stage.evidence > .lg-box{order:6}
.lg-box{margin-top:13px;border:1px solid rgba(232,179,57,.26);border-radius:12px;padding:13px 14px;
  background:rgba(232,179,57,.04)}
.lg-list{display:flex;flex-direction:column;gap:8px}
.lg-item{display:flex;flex-direction:column;gap:5px;text-align:left;padding:10px 12px;border-radius:10px;
  border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--fg2);
  font-size:13px;line-height:1.7;font-family:inherit;cursor:pointer;transition:.14s}
.lg-item:hover{border-color:var(--gold);transform:translateY(-2px);color:var(--fg)}
.lg-item.used{opacity:.34;cursor:not-allowed}
.lg-item.used:hover{transform:none;border-color:var(--line);color:var(--fg2)}
.lg-item.used .lg-t{text-decoration:line-through}
.lg-item.good{border-color:rgba(63,185,80,.55);background:rgba(63,185,80,.1)}
.lg-item.bad{border-color:rgba(229,72,77,.5);background:rgba(229,72,77,.09)}
.lg-h{font-size:11.5px;color:var(--gold);letter-spacing:.3px}
.lg-h b{color:var(--fg)}
.lg-t{font-size:13px;color:var(--fg2);line-height:1.7}
.lg-item.good .lg-t,.lg-item.bad .lg-t{color:var(--fg)}
.scold-cast{margin-bottom:10px;padding:10px 13px;border-radius:10px;border-left:2px solid var(--gold);
  background:rgba(232,179,57,.07);font-size:13px;line-height:1.82;color:var(--fg2)}
.scold-cast b{color:var(--gold)}
.scold-cast.fail{border-left-color:var(--red);background:rgba(229,72,77,.07)}
.scold-cast.fail b{color:var(--red)}

/* ============ 反馈层 · 音效 / 打字机 / 命中反馈 ============ */
#app.fx-shake{animation:fxShake .34s cubic-bezier(.36,.07,.19,.97)}
@keyframes fxShake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}
#app.fx-shake-hard{animation:fxShakeHard .5s cubic-bezier(.36,.07,.19,.97)}
@keyframes fxShakeHard{10%,90%{transform:translateX(-3px)}20%,80%{transform:translateX(7px)}30%,50%,70%{transform:translateX(-12px)}40%,60%{transform:translateX(12px)}}
.fx-flash{position:fixed;inset:0;pointer-events:none;z-index:80;animation:fxFlash .46s ease-out forwards}
@keyframes fxFlash{0%{opacity:.85}100%{opacity:0}}
.fx-pop{position:fixed;left:50%;top:15%;transform:translateX(-50%);font-weight:900;letter-spacing:2px;font-size:21px;pointer-events:none;z-index:85;white-space:nowrap;padding:3px 15px;border-radius:999px;background:rgba(8,10,15,.66);border:1px solid rgba(255,255,255,.08);animation:fxPop 1.05s cubic-bezier(.2,.9,.3,1) forwards;text-shadow:0 2px 14px rgba(0,0,0,.95)}
@keyframes fxPop{0%{opacity:0;transform:translate(-50%,14px) scale(.72)}16%{opacity:1;transform:translate(-50%,0) scale(1.06)}28%{transform:translate(-50%,0) scale(1)}72%{opacity:1}100%{opacity:0;transform:translate(-50%,-40px) scale(1)}}
.fx-combo{position:fixed;left:50%;top:29%;transform:translate(-50%,-50%);font-weight:900;letter-spacing:3px;pointer-events:none;z-index:86;white-space:nowrap;text-shadow:0 0 32px currentColor;animation:fxCombo 1.05s cubic-bezier(.2,.9,.3,1) forwards}
@keyframes fxCombo{0%{opacity:0;transform:translate(-50%,-50%) scale(.5) rotate(-6deg)}22%{opacity:1;transform:translate(-50%,-50%) scale(1.16) rotate(2deg)}38%{transform:translate(-50%,-50%) scale(1) rotate(0)}78%{opacity:1}100%{opacity:0;transform:translate(-50%,-64%) scale(1.04)}}
.dlg-text.tw-caret::after{content:"▌";margin-left:1px;color:var(--gold);animation:twBlink .62s steps(1) infinite}
@keyframes twBlink{0%,49%{opacity:1}50%,100%{opacity:0}}
.fx-btn{background:var(--bg3);border:1px solid var(--line);color:var(--fg2);font-family:inherit;font-size:11px;font-weight:700;line-height:1.6;padding:4px 9px;border-radius:6px;cursor:pointer;transition:.18s;white-space:nowrap}
.fx-btn:hover{border-color:var(--gold);color:var(--gold)}
.fx-btn.off{opacity:.45}
.alarm-wrap.hot .alarm-bar i{animation:fxAlarm .9s ease-in-out infinite}
@keyframes fxAlarm{0%,100%{filter:brightness(1)}50%{filter:brightness(1.75)}}
/* 按下反馈：所有可点元素压一下再回弹（只改 filter/transform，不影响布局测量） */
.btn:active{transform:translateY(1px) scale(.985);filter:brightness(1.14)}
.opt:active{transform:translateX(4px) scale(.978);filter:brightness(1.16)}
.pick-btn:active,.crack-item:active,.arm-item:active,.case-card:active,.pc-frag:active,
.pc-slot:active,.gd-cell:active,.lg-item:active,.sv-spot:active,.fx-btn:active{filter:brightness(1.22) saturate(1.06)}
@media(prefers-reduced-motion:reduce){
  #app.fx-shake,#app.fx-shake-hard,.fx-flash,.fx-pop,.fx-combo,.dlg-text.tw-caret::after{animation:none!important}
  .fx-flash,.fx-pop,.fx-combo{display:none!important}
}

<body>
<div id="app">
  <div class="hud">
    <span class="hud-step" id="hudStep">现场</span>
    <div class="hud-bar"><i id="hudFill"></i></div>
    <span class="hud-clock" id="hudClock">00:00</span>
    <span class="hud-cost" id="costHud">真AI: 检测中…</span>
  </div>
  <div class="card" id="stage"></div>
</div>

<script>
/* ============ 数据层 ============ */
const PRICE = {in:0.27, out:1.10};
// 只有从本地文件打开（file://）或本地回环地址打开时，才去连本地代理；
// 从任何 https 域名打开都走同源，否则线上会被误判成本地
const IS_LOCAL_FILE = location.protocol === "file:";
const IS_LOOPBACK = ["127.0.0.1","localhost","[::1]"].includes(location.hostname);
const API_URL_HOST = "";

/* ==========================================================
   追问深度判定词库（全局，与具体案件无关）
   玩家不需要背词——凭常识追问（问时间、问人物、问"你刚才不是说"）就能生效
   ========================================================== */
const PROBE = {
  // 1) 追问细节：时间 / 人物 / 数量 / 凭证
  detail:["几号","哪天","什么时候","早上","下午","几点","谁在","谁签","谁批","谁做的","几个人","多少次","几笔","几张","哪个","具体","当时","后来","怎么处理","凭证","记录","单子在哪","原件"],
  // 2) 指出矛盾：拿他刚说的话反过来压他
  clash:["你不是说","你刚才说","可你","但你说","你自己说","矛盾","对不上","不一致","说不通","解释不通","前面说","怎么又","既然","那为什么"],
  // 3) 追问动机 / 来源
  motive:["为什么","怎么会","凭什么","你怎么知道","谁告诉","依据","理由","图什么","为了什么"]
};

/* ==========================================================
   案件一：账上迷雾（经济犯罪 · 职务侵占）
   —— 以下整块是"纯数据"，引擎逻辑在文件后半部分
   ========================================================== */
const CASE_BOOK = {};
{
  const ROLE_IDS = ["SHEN","LIN","ZHOU","ZHENG"];

  const SUSPECTS = {
    SHEN:{n:"沈亦舟",short:"沈",role:"财务总监 · 42岁",color:"var(--red)",
      profile:"掌管公司财务十二年，说话慢条斯理，习惯用“流程”“合规”这类词。",
      secret:"骐骥电子、远望材料两家供应商实际由你控制，法定代表人是你的远房亲戚。12 笔拆单是你授意的（100 万以上需双签）。你让仓管员陈立免于交接。你在 5 月 6 日警告过林湘，7 月 1 日亲自把郑维的疑问邮件标记为已解决。",
      style:"慢条斯理，爱用“流程”“合规”“监管失职”这些词。装作被下属蒙蔽的受害者。绝不承认控制供应商。被问拆单就答“为满足月度成本配比要求，属常规核算处理”。被逼急了会反咬“是不是因为我职位最高才盯着我”。",
      lie:"永远不承认骐骥电子和远望材料是自己的。",
      voice:["我承认监管有失职。但我签的是汇总审批，不是逐笔验货，这个责任划分要讲清楚。","公司有完整的采购流程，每一环都有责任人。我是最终审批环节，不是唯一环节。","林湘录账的时候有没有核对过原始单据？这是她的岗位职责。"],
      defense:{C1:"账户信息不在我管控范围内。资金流向由供应商自己决定，我无权过问。",
               C2:"编号是采购和仓管负责的，我看的是汇总表，看不到单号。",
               C3:"陈立离职的事我不知道，人事流程不归财务管。",
               C4:"供应商准入是采购部在做，注册地址我不掌握。",
               C5:"高新复审材料是按规定比例归集的，我保证了报表层面的合规。",
               C6:"拆单是核算惯例。研发费用要按月配比，一笔 780 万直接入账会让当期成本失真，这是准则要求的。",
               C7:"那封邮件我让下面人跟进了，归档是常规操作，不代表内容不重要。",
               C8:"免于交接是人力建议的，我签字只是走流程。"}
    },
    LIN:{n:"林湘",short:"林",role:"成本会计 · 29岁",color:"var(--blue)",
      profile:"公司最年轻的会计，做事快，对数字敏感。一直强调“我只是按指令录账”。",
      secret:"4 月 30 日你发现入库单编号异常当天就拍照存进私人云盘。5 月 6 日沈亦舟警告你“别往外面说”。你怕丢工作所以没上报。",
      style:"年轻、反应快、防御性强。强调“我只是照单录账”。被逼问时会暗示“编号是连续的”“有人警告过我”，但绝不主动交出云盘截图。委屈时会说“我一个成本会计没有权限决定付给谁”。",
      lie:"不主动承认自己留了截图。",
      voice:["我只负责录账。采购买什么、谁验收，都不是我决定的。","我承认有几笔是我录的，但我每天要处理几十张单，不可能每张都查验收人在不在职。","你们要问的是采购单谁开的、供应商谁引进的。"],
      defense:{C1:"钱转去哪了我不知道，我只管账面上的采购成本。",
               C2:"编号的事我确实发现了。但我以为是系统问题……我没往上报。",
               C3:"陈立这个名字我有印象。但核对验收人在不在职不是我的职责。",
               C4:"供应商的信息我接触不到，我只看到采购单上的名字。",
               C5:"占不占比的，材料不是我做的。",
               C6:"拆单不是我决定的，我看到的就是一笔一笔的单子。",
               C7:"邮件的事我不清楚，我不参与审计对接。",
               C8:"离任审计不是我的职责范围。"}
    },

const BRIDGE = {
  base: API_URL_HOST,
  online:false,
  gameId:"s" + Date.now().toString(36),
  stats:null,
  async health(retry){
    try{
      const r = await fetch(this.base + "/api/health",{cache:"no-store"});
      const j = await r.json();
      this.online = Boolean(j.ok && j.hasKey);
      this.stats = j.stats;
      return j;
    }catch(e){
      this.online=false;
      // 首次探测失败自动重试一次，避免网络抖动导致输入框永久锁死
      if(retry !== false){
        await new Promise(r=>setTimeout(r,1200));
        return this.health(false);
      }
      return {ok:false,hasKey:false};
    }
  },
  async ask(payload){
    if(!this.online) return null;
    try{
      const r = await fetch(this.base + "/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify(Object.assign({gameId:this.gameId},payload))});
      const j = await r.json();
      if(j.stats) this.stats = j.stats;
      return j.text ? j : null;
    }catch(e){ return null; }
  }
};

/* ============ 反馈层 · 音效 / 打字机 / 命中反馈 ============
   全部本地合成与 CSS 动画，不引入任何外部资源。
   测试可置 window.__FX_OFF = true 或 URL 加 ?fx=0 整体关闭。 */
const FX = (function(){
  const OFF = (function(){ try{ return !!window.__FX_OFF; }catch(e){ return false; } })();
  let reduce = false;
  try{ reduce = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches); }catch(e){}
  let q = "";
  try{ q = String(location.search || ""); }catch(e){}
  const killed = OFF || /[?&]fx=0/.test(q);

  const cfg = {
    on:    !killed,
    audio: !killed && !/[?&]sfx=0/.test(q),
    type:  !killed && !reduce && !/[?&]type=0/.test(q),
    move:  !killed && !reduce,
    vol:   0.42
  };
  try{
    const v = localStorage.getItem("szd_fx_vol");
    if(v != null) cfg.vol = Number(v) || 0;
    if(localStorage.getItem("szd_fx_audio") === "0") cfg.audio = false;
  }catch(e){}

  /* —— 音频：Web Audio 实时合成，零音频文件 —— */
  let AC = null, MG = null;
  function ctx(){
    if(!cfg.audio) return null;
    try{
      if(!AC){
        const C = window.AudioContext || window.webkitAudioContext;
        if(!C) return null;
        AC = new C();
        MG = AC.createGain();
        MG.gain.value = cfg.vol;
        MG.connect(AC.destination);
      }
      if(AC.state === "suspended" && AC.resume) AC.resume();
      return AC;
    }catch(e){ return null; }
  }
  function tone(f, dur, type, v, to, delay){
    const c = ctx(); if(!c) return;
    try{
      const t0 = c.currentTime + (delay || 0);
      const o = c.createOscillator(), g = c.createGain();
      o.type = type || "sine";
      o.frequency.setValueAtTime(f, t0);
      if(to) o.frequency.exponentialRampToValueAtTime(Math.max(24, to), t0 + dur);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(v, t0 + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(MG);
      o.start(t0); o.stop(t0 + dur + 0.03);
    }catch(e){}
  }
  function hiss(dur, v, hp, delay){
    const c = ctx(); if(!c) return;
    try{
      const n = Math.max(1, Math.floor(c.sampleRate * dur));
      const buf = c.createBuffer(1, n, c.sampleRate);
      const d = buf.getChannelData(0);
      for(let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2.2);
      const s = c.createBufferSource(); s.buffer = buf;
      const f = c.createBiquadFilter(); f.type = "highpass"; f.frequency.value = hp || 900;
      const g = c.createGain(); g.gain.value = v;
      s.connect(f); f.connect(g); g.connect(MG);
      s.start(c.currentTime + (delay || 0));
    }catch(e){}
  }
  const SND = {
    nav(){ tone(560,.06,"triangle",.055,700); },
    open(){ tone(330,.09,"sine",.05,470); tone(660,.07,"sine",.028,890,.05); },
    tick(u){ tone(u?1520:1020,.028,"square",u?.048:.024); },
    hit(){ tone(880,.08,"triangle",.085,1320); tone(1320,.17,"triangle",.052,1780,.055); hiss(.07,.026,3200); },
    miss(){ tone(230,.17,"sawtooth",.058,118); hiss(.09,.02,380); },
    crack(){ hiss(.045,.05,2000); tone(1680,.05,"square",.042,920,.01); tone(2460,.1,"triangle",.026,1180,.035); },
    read(){ tone(1180,.07,"sine",.05,1520); tone(1760,.09,"sine",.026,2100,.06); },
    piece(){ tone(310,.06,"triangle",.07,220); hiss(.05,.026,620); },
    grid(){ tone(660,.055,"triangle",.058,900); tone(990,.09,"sine",.028,1240,.04); },
    soft(){ tone(520,.05,"sine",.034,640); },
    warn(){ tone(190,.3,"sawtooth",.045,340); },
    over(){ [300,220,160].forEach(function(f,i){ tone(f,.5,"sawtooth",.05,f*.72,i*.12); }); },
    win(){ [523,659,784,1047].forEach(function(f,i){ tone(f,.52,"triangle",.05,null,i*.085); }); hiss(.3,.018,2600,.2); }
  };

  /* —— 屏幕反馈 —— */
  let shakeT = null;
  function appEl(){ try{ return document.getElementById("app"); }catch(e){ return null; } }
  function shake(hard){
    if(!cfg.move) return;
    const a = appEl(); if(!a) return;
    try{
      const cls = hard ? "fx-shake-hard" : "fx-shake";
      a.classList.remove("fx-shake"); a.classList.remove("fx-shake-hard");
      void a.offsetWidth;
      a.classList.add(cls);
      clearTimeout(shakeT);
      shakeT = setTimeout(function(){ a.classList.remove(cls); }, hard ? 540 : 380);
    }catch(e){}
  }
  function flash(color, a0){
    if(!cfg.move) return;
    try{
      const d = document.createElement("div");
      d.className = "fx-flash";
      d.style.background = "radial-gradient(circle at 50% 42%," + color + ", transparent 70%)";
      if(a0 != null) d.style.opacity = String(a0);
      document.body.appendChild(d);
      setTimeout(function(){ if(d.remove) d.remove(); }, 470);
    }catch(e){}
  }
  function float(text, color, top){
    if(!cfg.move || !text) return;
    try{
      /* 只留一条：新的反馈替换旧的，避免叠字互相压住 */
      const olds = document.querySelectorAll(".fx-pop");
      for(let i = 0; i < olds.length; i++){ if(olds[i].remove) olds[i].remove(); }
      const d = document.createElement("div");
      d.className = "fx-pop";
      d.style.color = color || "var(--gold)";
      if(top) d.style.top = top;
      d.textContent = text;
      document.body.appendChild(d);
      setTimeout(function(){ if(d.remove) d.remove(); }, 1120);
    }catch(e){}
  }
  function combo(n){
    if(!cfg.move || !n || n < 2) return;
    try{

      for(let i = 0; i < olds.length; i++){ if(olds[i].remove) olds[i].remove(); }
      const tier = n >= 6 ? 2 : (n >= 3 ? 1 : 0);
      const d = document.createElement("div");
      d.className = "fx-combo";
      d.style.color = ["var(--gold)","#ffd166","#ff7a45"][tier];
      d.style.fontSize = String(28 + tier * 9) + "px";
      d.textContent = "连击 ×" + n;
      document.body.appendChild(d);
      setTimeout(function(){ if(d.remove) d.remove(); }, 1120);
    }catch(e){}
  }

  /* —— 打字机：先把全文落进 DOM 并锁高，再逐字显现。
        锁高保证动画期间不推动下方元素（布局测量不受影响）。 —— */
  let twNode = null, twFull = "", twT = null, lastTyped = "";
  function skipType(){
    if(!twNode) return;
    if(twT){ clearTimeout(twT); twT = null; }
    try{ twNode.textContent = twFull; twNode.classList.remove("tw-caret"); }catch(e){}
    twNode = null;
  }
  function typeDialog(){
    let node = null;
    try{ node = document.querySelector(".dlg-text"); }catch(e){ return; }
    if(!node) return;
    const full = String(node.textContent == null ? "" : node.textContent);
    if(!full) return;
    skipType();
    if(!cfg.type || full.length < 3 || lastTyped === full){ lastTyped = full; return; }
    lastTyped = full;
    let lock = 0;
    try{ lock = node.offsetHeight || 0; }catch(e){}
    if(lock) node.style.minHeight = lock + "px";
    const per = Math.max(10, Math.min(28, 760 / full.length));
    let i = 0;
    twNode = node; twFull = full;
    node.textContent = "";
    try{ node.classList.add("tw-caret"); }catch(e){}
    const step = function(){
      i++;
      node.textContent = full.slice(0, i);
      if(i >= full.length){ twT = null; skipType(); return; }
      twT = setTimeout(step, per);
    };
    step();
  }
  function typing(){ return !!twT; }

  /* —— 顶栏音效开关 —— */
  function hud(){
    if(!cfg.on) return;                    /* 总闸关掉时连开关都不出现 */
    try{
      const bar = document.querySelector(".hud");
      if(!bar || !bar.appendChild) return;
      const b = document.createElement("button");
      b.id = "fxSound";
      b.className = "fx-btn" + (cfg.audio ? "" : " off");
      b.textContent = cfg.audio ? "🔊 音效" : "🔇 静音";
      b.onclick = function(){
        cfg.audio = !cfg.audio;
        try{ localStorage.setItem("szd_fx_audio", cfg.audio ? "1" : "0"); }catch(e){}
        b.className = "fx-btn" + (cfg.audio ? "" : " off");
        b.textContent = cfg.audio ? "🔊 音效" : "🔇 静音";
        if(cfg.audio) SND.nav();
      };
      bar.appendChild(b);
    }catch(e){}
  }

  /* 首次交互解锁音频；点击任意处跳过打字机 */
  try{
    const unlock = function(){
      ctx();
      try{ document.removeEventListener("pointerdown", unlock, true); document.removeEventListener("keydown", unlock, true); }catch(e){}
    };
    document.addEventListener("pointerdown", unlock, true);
    document.addEventListener("keydown", unlock, true);
    document.addEventListener("click", function(){ if(typing()) skipType(); }, true);
  }catch(e){}

  return {
    cfg: cfg,
    on: cfg.on,
    nav(){ if(cfg.audio) SND.nav(); },
    open(){ if(cfg.audio) SND.open(); },
    tick(u){ if(cfg.audio) SND.tick(u); },
    hit(){ if(cfg.audio) SND.hit(); },
    miss(){ if(cfg.audio) SND.miss(); },
    crack(){ if(cfg.audio) SND.crack(); },
    read(){ if(cfg.audio) SND.read(); },
    piece(){ if(cfg.audio) SND.piece(); },
    grid(){ if(cfg.audio) SND.grid(); },
    soft(){ if(cfg.audio) SND.soft(); },
    warn(){ if(cfg.audio) SND.warn(); },
    win(){ if(cfg.audio) SND.win(); },
    over(){ if(cfg.audio) SND.over(); },
    shake: shake,
    flash: flash,
    float: float,
    combo: combo,
    typeDialog: typeDialog,
    skipType: skipType,
    typing: typing,
    /* 组合反馈：一次调用把声音 + 画面 + 飘字一起给 */
    good(msg){
      if(cfg.audio) SND.hit();
      flash("rgba(232,179,57,.20)");
      float(msg || "命中要害", "var(--gold)");
    },
    bad(msg, n){
      if(cfg.audio) SND.miss();
      shake(false);
      flash("rgba(229,72,77,.22)");
      float(msg || ("警戒 +" + (n || 0)), "var(--red)");
    },
    hud: hud
  };
})();

  if(s===2) return renderInterrogate(true);

  hudFill.style.width=(i/(STEPS.length-1)*100)+"%";
  render();
}

/* 审讯台：对话框正下方的追问输入区（放在首屏内，不用滚动就能看到） */
function askDesk(){
  const rid = S.active;
  const task = taskLine();
  if(!rid) return `
    <div class="ask-desk idle">
      <div class="ad-hint">${task ? task : "先点上面的名字。"}</div>
    </div>`;
  const s = SUSPECTS[rid];
  const opened = S.opened[rid] || [];
  let hint;
  if(CHAIN){
    const st = chainOf(rid), c = curChain();
    if(st === "retired") hint = `已经问透了——该找的是 ${c?SUSPECTS[c.who].n:""}`;
    else if(st === "locked") hint = `你手上还没有能压住他的东西`;
    else hint = `问他时间、问他人名、问他为什么——或者拿他刚说的话堵他`;
  } else {
    hint = opened.length
      ? `正在追「${opened.map(k=>CLUES[k].t).join("、")}」`
      : `问他时间、问他谁在场、问他数目——或者拿他刚说的话堵他`;
  }
  return `
    <div class="ask-desk">
      ${task}
      <div class="ad-top">
        <span class="ad-who" style="color:${s.color}">对 ${s.n} 说</span>
        <span class="ad-hint">${hint}</span>
      </div>
      ${probeBox("", false)}
    </div>`;
}

/* 本幕目标：告诉玩家"该抓住谁、哪句话" */
function taskLine(){
  // —— 链式模式 ——
  if(CHAIN){
    const c = curChain();
    if(!c){
      return `<div class="task-line"><div class="tl-t">收网</div><div>账、单、人，一条线全串上了。<b>指认吧。</b></div></div>`;
    }
    const who = SUSPECTS[c.who].n;
    const col = SUSPECTS[c.who].color;
    let inner;
    const ks = c.keys || [];
    if(S.chainReady){
      inner = c.action
        ? `<div style="color:var(--green)">▍这条线通了。再往下查一层。</div>`
        : `<div style="color:var(--red)">▍问到底了。就是他。</div>`;
    } else if(S.hintLevel >= 3){
      inner = `<div style="color:var(--gold)">▍想不出就问：「${esc(c.hint3)}」</div>`;
    } else if(S.hintLevel === 2){
      inner = `<div>▍往这边想：<b style="color:var(--gold)">${esc(ks.join(" · "))}</b></div>`;
    } else if(S.hintLevel === 1){
      inner = `<div style="color:var(--fg2)">▍别问「为什么」，问「谁」——谁让他这么做的。</div>`;
    } else {
      inner = `<div>${esc(c.seen)}</div>`;
    }
    let wrong = "";
    if(S.active && S.active !== c.who){
      const st2 = chainOf(S.active);
      const nm = SUSPECTS[S.active].n;
      if(st2 === "retired"){
        wrong = `<div class="tl-wrong">${esc(nm)} 已经问透了，他身上没有新东西。这层要找的是 <b style="color:${col}">${esc(who)}</b>。</div>`;
      } else if(st2 === "locked"){
        wrong = `<div class="tl-wrong">现在问 ${esc(nm)} 还太早——你手上没有能压住他的东西。先把 <b style="color:${col}">${esc(who)}</b> 追完。</div>`;
      } else {
        wrong = `<div class="tl-wrong">这一句不是问 ${esc(nm)} 的。这层要找的是 <b style="color:${col}">${esc(who)}</b>。</div>`;
      }
    }
    return `<div class="task-line"><div class="tl-t">${esc(c.tag)} &nbsp;·&nbsp; 去问 ${esc(who)}</div>${inner}${wrong}</div>`;
  }
  // —— 分幕模式（旧）——
  const st = curStage();
  if(!st || !st.task) return "";
  const t = st.task;
  const who = SUSPECTS[t.rid].n;
  const won = Object.keys(CLUES).length ? CLUES[t.clue].t : "";
  const kk = st.keys || [];
  // 三个层级的提示强度（关键词制）
  let inner;
  if(S.hintLevel >= 3){
    inner = `<div style="color:var(--gold)">▍想不出就问：「${esc(st.hint3||"")}」</div>`;
  } else if(S.hintLevel === 2){
    inner = `<div>▍往这边想：<b style="color:var(--gold)">${esc(kk.join(" · "))}</b></div>`;
  } else if(S.hintLevel === 1){
    inner = `<div>▍往这边想：<b style="color:var(--gold)">${esc(kk[0]||"")}</b></div>`;
  } else {
    inner = `<div>把「${won}」摆到 <b style="color:${SUSPECTS[t.rid].color}">${who}</b> 面前，听他怎么辩。</div>`;
  }
  // 点错人时给一句轻提示，不打断
  let wrong = "";
  if(S.active && S.active !== t.rid){
    wrong = `<div class="tl-wrong">这一句不是问 ${SUSPECTS[S.active].n} 的——他接不上。本幕要问的是 <b style="color:${SUSPECTS[t.rid].color}">${who}</b>。</div>`;
  }
  return `<div class="task-line"><div class="tl-t">本幕目标</div>${inner}${wrong}</div>`;
}

function introScene(){
  for(const k in ART){ if(ART[k] && ART[k].scene) return ART[k].scene; }
  return "";
}

/* 角色头像：有立绘用立绘，没有就用姓氏色块 */
function avaMarkup(id, cls){
  const s = SUSPECTS[id];
  if(!s) return "";
  const art = curArt();
  const src = art && art.avas[id] ? art.avas[id] : "";
  return `<div class="ava${cls?" "+cls:""}" style="background:${s.color}">`
       + (src ? `<img src="${src}" alt="">` : `<span>${s.short}</span>`) + `</div>`;
}

/* 动态立绘：给角色配了短视频就播视频，没配就回落静图 */
function charLive(id){
  const art = curArt();
  return (art && art.lives && art.lives[id]) ? art.lives[id] : "";
}

/* 景别预置：同一张图靠 object-position + 缩放 + 缩放中心，切出不同镜头。
   不生成任何新素材，改一个数字就换构图。

   清晰度换算：图先被 cover 压到容器宽（1536 图进 960 宽 = 0.625 倍），
   再按 z 放大，所以「实际放大倍率 = z × 0.625」。可见的原图宽度 = 1536 / z。
   安全线取实际放大 ≤1.5x，对应 z ≤ 2.4 —— 也就是裁切区不低于 640 原图像素。 */
const VIEW = {
  establish:{ pos:"50% 42%", z:1,    org:"50% 50%"     },
  ots:      { pos:"50% 42%", z:1,    org:"50% 50%"     },
  mcu:      { pos:"50% 42%", z:1.6,  org:"65.75% 32.7%"},
  cu:       { pos:"50% 42%", z:2.2,  org:"66% 36%"     },
  insert:   { pos:"50% 42%", z:2.2,  org:"72% 45%"     },
};

/* 一层里的分镜格组：新格式按「层号_角色」查 panels，老格式退到单张 shots。
   没配的层返回 null，画面仍走「空场景 + 立绘」老路。 */
function panelsOf(art){
  if(!art || !S.active) return null;
  const n = (S.chainStep | 0) + 1;
  const key = n + "_" + S.active;
  const set = art.panels && (art.panels[key] || art.panels[n]);
  if(set && set.length) return set;
  const one = art.shots && (art.shots[key] || art.shots[n]);
  return one ? [{ img:one, view:"ots" }] : null;
}

/* 相位天然是四个节拍：勘察 → 突破 → 追问 → 收尾。
   第五案多一个「读身体」，与追问共用近景格；问话待得最久，所以近景给问话。 */
const PHASE_BEAT = { evidence:0, crack:1, read:2, ask:2, done:3 };
function panelIdx(set, ch){
  const last = set.length - 1;
  let k;
  if(ch && Object.prototype.hasOwnProperty.call(PHASE_BEAT, ch.phase)){
    k = PHASE_BEAT[ch.phase];
  } else {
    k = 1 + ((ch && ch.picked) ? ch.picked.length : 0);
  }
  return Math.max(0, Math.min(k, last));
}

/* 当前该显示哪一格。返回 null 表示这个案子/这一层没配分镜。 */
function shotOf(art, ch){
  const set = panelsOf(art);
  if(!set) return null;
  const k = panelIdx(set, ch);
  const p = set[k] || set[0];
  if(!p || !p.img) return null;
  const base = VIEW[p.view] || VIEW.ots;
  return {
    img: p.img,
    pos: p.pos || base.pos,
    z:   p.z   || base.z,
    org: p.org || base.org,
    view: p.view || "ots",
    idx: k,
    total: set.length,
  };
}

/* 把「对错」翻译成镜头：命中→急推顿住，有收获→横移，问偏→推近压迫。
   选项若自带 rx（push/hit/pull/pan/hold），直接用它覆盖默认。 */
const RX_SHOTS = ["push","hit","pull","pan","hold"];
const RX_DEFAULT = { good:"hit", mid:"pan", bad:"push" };
function shotReact(r){
  if(!r) return "";
  if(RX_SHOTS.indexOf(r) >= 0) return r;
  return RX_DEFAULT[r] || "push";
}

/* 场景层：整图剧照，或审讯室背景 + 当前被问话人的立绘
   react: "" | "good" | "mid" | "bad"（对错）或 push/hit/pull/pan/hold（镜头） */
function sceneBlock(react){
  const art = curArt();
  if(!art) return "";
  const rid = S.active;
  const src = rid && art.chars[rid] ? art.chars[rid] : "";
  const live = rid ? charLive(rid) : "";
  const s = rid ? SUSPECTS[rid] : null;
  const shot = shotOf(art, S.ch);
  const inner = shot ? ""
    : (!src ? ""
        : (live
            ? `<video src="${live}" autoplay loop muted playsinline preload="auto"></video>`
            : `<img src="${src}" alt="">`));
  const rx = shot ? shotReact(react) : react;
  const sk = shot ? (shot.img + "#" + shot.idx) : "";
  const cut = !!shot && sk !== S._shotKey;
  if(shot) S._shotKey = sk;
  const cls = shot
    ? "scene full" + (rx ? " react-" + rx : "") + (cut ? " shotcut" : "")
    : "scene" + (react ? " react-" + react : "") + (react === "bad" ? " shake" : "");
  return `
    <div class="${cls}"${shot ? "" : ` style="background-image:url('${art.scene}')"`}>
      ${shot ? `<div class="scene-shot" data-view="${shot.view}" data-panel="${shot.idx + 1}"><img src="${shot.img}" alt="" style="--pos:${shot.pos};--z:${shot.z};--org:${shot.org}"></div>` : ""}
      <div class="scene-char" id="sceneChar" style="${src && !shot ? "" : "opacity:0"}">${inner}</div>
      ${s
        ? `<div class="scene-badge"><img src="${art.avas[rid]}" alt="">
             <div><b style="color:${s.color}">${s.n}</b><span>${s.role}</span></div></div>`
        : `<div class="scene-badge"><div><b style="color:var(--fg3)">询问室</b><span>点下面的名字把人叫进来</span></div></div>`}
    </div>`;
}

/* 嫌疑人卡（公共渲染：支持链式状态） */
function renderSuspects(){
  return ROLE_IDS.map(id=>{
    const s=SUSPECTS[id], d=S.defense[id], cracked=S.cracked[id];
    const c = d>70?"var(--green)":(d>40?"var(--gold)":"var(--red)");
    let st = null, badge = "";
    if(CHAIN){
      st = chainOf(id);
      if(st === "target")      badge = `<div class="sus-badge now">问这个</div>`;
      else if(st === "retired") badge = `<div class="sus-badge out">问透了</div>`;
      else if(st === "locked")  badge = `<div class="sus-badge lock">还没到时候</div>`;
    }
    return `<div class="sus ${S.active===id?"active":""} ${cracked?"cracked":""} ${st==="retired"?"retired":""} ${st==="locked"?"lockedp":""}" onclick="selectSuspect('${id}')">
      <div class="sus-head">
        ${avaMarkup(id)}
        <div><div class="sus-name">${s.n}</div><div class="sus-role">${s.role}</div></div>
      </div>
      <div class="def-wrap">
        <div class="def-label"><span>${cracked?"防线已崩":"防线"}</span><span style="color:${c}">${Math.max(0,d)}</span></div>
        <div class="def-bar"><i style="width:${Math.max(0,d)}%;background:${c}"></i></div>
      </div>
      ${badge}
    </div>`;
  }).join("");
}

/* 局部刷新：只更新嫌疑人卡 / 对话框 / 面板 / 统计，保留输入框焦点与键盘 */
function refreshParts(){
  if(S.step===0 || S.step===3) return render();
  const canEvidence = S.step===2;
  const w = $("susWrap"); if(w) w.innerHTML = renderSuspects();
  const dlg = $("dlg");
  if(dlg) dlg.innerHTML = S.active
    ? renderDialog()
    : `<div class="dlg-text" style="color:var(--fg3)">点名字，把他叫进来。</div>`;
  // 审讯台：只换顶部提示文字，输入框原地保留
  const aw = $("askWrap");
  if(aw){
    const top = aw.querySelector(".ad-top");
    const tl = aw.querySelector(".task-line");
    const newTl = taskLine();
    if(newTl){
      if(tl) tl.outerHTML = newTl;
      else aw.insertAdjacentHTML("afterbegin", newTl);
    } else if(tl){ tl.remove(); }
    if(!S.active){
      if(!aw.querySelector(".ask-desk.idle")) aw.innerHTML = askDesk();
    } else if(!top){
      aw.innerHTML = askDesk();     // 从"未选人"切到"已选人"，需要建出输入框
    } else {
      const s = SUSPECTS[S.active];
      const opened = S.opened[S.active] || [];
      let hint;
      if(CHAIN){
        const st2 = chainOf(S.active);
        const c2 = curChain();
        if(st2 === "retired") hint = `已经问透了——该找的是 ${c2?SUSPECTS[c2.who].n:""}`;
        else if(st2 === "locked") hint = `你手上还没有能压住他的东西`;
        else hint = `问他时间、问他人名、问他为什么——或者拿他刚说的话堵他`;
      } else {
        hint = opened.length
          ? `正在追「${opened.map(k=>CLUES[k].t).join("、")}」`
          : `问他时间、问他谁在场、问他数目——或者拿他刚说的话堵他`;
      }
      top.innerHTML = `<span class="ad-who" style="color:${s.color}">对 ${s.n} 说</span><span class="ad-hint">${hint}</span>`;
    }
  }
  const pw = $("panelWrap");
  if(pw){
    // 面板里已不含输入框，可以安全整块重建
    pw.innerHTML = CHAIN ? renderActionPanel()
                 : ((canEvidence || STAGES) ? renderEvidencePanel() : renderOpenPanel());
    const fb = pw.querySelector(".fb");
    const newNote = (S.note && S.note!=="thinking")
      ? `<div class="fb ${S.noteKind||"miss"}">${S.note}</div>` : "";
    if(fb){ if(newNote) fb.outerHTML = newNote; else fb.remove(); }
    else if(newNote){
      const ap = pw.querySelector(".act-panel");
      if(ap) ap.insertAdjacentHTML("beforeend", newNote);
    }
  }
  const tb = $("turnBar");
  if(tb) tb.innerHTML = `已质询 <b style="color:var(--gold)">${S.turns}</b> 次 · 有效 <b style="color:var(--green)">${S.hits}</b> · 无效 <b style="color:var(--fg3)">${S.misses}</b> · 最高连击 <b style="color:var(--purple)">${S.bestCombo}</b>`;
  updateCostHUD();
}

function renderDialog(){
  const s=SUSPECTS[S.active], d=S.defense[S.active];
  const last=S.chat.filter(c=>c.roleId===S.active).slice(-1)[0];
  const showReact = S.dialogText && S.dialogRole===S.active;
  const raw = showReact ? S.dialogText : (last ? last.text : "");
  const act = showReact ? (S.dialogAct || null) : null;
  const ACTMAP = window.ACT || {};
  const a = act ? ACTMAP[act] : null;

  /* 表演渲染：把一句话按动作拆成带节奏的排版 */
  function perform(text, actKey){
    const body = esc(text);
    switch(actKey){
      /* 卡住：句中的省略号断开，中间插一段空白 */
      case "PAUSE":
        return body.replace(/……/, `……<span class="act-gap"></span>`);
      /* 吞回去：省略号后半句淡出 */
      case "SWALLOW":
        return body.replace(/……(.{0,14})$/, `……<span class="act-fade">$1</span>`);
      /* 反问：整句降一档亮度，像把话推回来 */
      case "DEFLECT":
        return `<span class="act-defl">${body}</span>`;
      /* 话变多：首句后断开空一行 */
      case "OVERRUN":
        return body.replace(/。/, `。<span class="act-gap sm"></span>`);
      /* 沉默：整句更暗、更慢 */
      case "SILENCE":
        return `<span class="act-sil">${body}</span>`;
      default:
        return body;
    }
  }

  const inner = raw ? perform(raw, act) : `<span style="color:var(--fg3)">${s.profile}</span>`;
  const body = showReact
    ? `<span style="color:${d<=25?"var(--red)":"var(--ink)"}">${inner}</span>`
    : inner;

  const tone = d<=25 ? "var(--red)" : "var(--fg3)";
  const tagText = (d<=25 && S.cracked[S.active]) ? "防线已崩 · 他说漏了" : S.dialogTag;
  const tag = (showReact && tagText)

/* ============ 质询核心 ============ */
/* 摊证据：把线索摆到他面前，他给一段辩解。这是"对话"的开始，不是"得分"的动作 */
async function doEvidence(){
  const k=S.selClue, rid=S.active;
  if(!k){ toast("先选一条线索"); return; }
  if(!rid){ toast("先点一个嫌疑人"); return; }
  S.turns++;
  S.note=`<b style="color:var(--gold)">▍你把「${CLUES[k].t}」摊在了他面前……</b>`;
  S.noteKind="mid";
  render();

  // 记录：这条已摊在他面前
  if(!S.opened[rid]) S.opened[rid]=[];
  const isNew = !S.opened[rid].includes(k);
  if(isNew) S.opened[rid].push(k);
  S.tried[k+"-"+rid]=true;

  // 让他针对这条证据辩解
  const raw = (PLEA[rid] && PLEA[rid][k]) || null;
  const pleaText = raw ? raw.t : "这个……我得看一下当时的情况，不好凭一句话说。";
  S.chat.push({roleId:rid, text:pleaText, kind:"plea"});
  S.dialogText=""; S.dialogTag=""; S.dialogRole="";
  S.lastPlea = raw ? {weak:raw.weak, tip:raw.tip} : null;

  // 摊证据本身只小幅动摇（他有准备）
  const p = CLUES[k].power[rid];
  const delta = p>=3 ? 8 : (p===2 ? 5 : (p===1 ? 2 : 0));
  if(delta>0){ S.hits++; applyDefense(rid, delta); } else { S.misses++; }

  S.note = `<b>▍「${CLUES[k].t}」摆上去了。</b>${SUSPECTS[rid].n}：「${pleaText}」<br><br><span style="color:var(--gold)">这只是一套说法。<b>下面是他的破绽——顺着它问。</b></span>`;
  S.noteKind = "mid";
  S.selClue=null;

  /* 链式模式：摊对证据 = 打开了这一层的门。
     提示玩家现在可以问什么（但不说答案）。 */
  if(CHAIN){
    const c = curChain();
    if(c && rid === c.who && !S.chainReady){
      const nt = CLUES[k] ? CLUES[k].t : "";
      if((c.need||c.clue) === k){
        S.note = `<b style="color:var(--green)">▍东西摆上去了</b> `
               + `${SUSPECTS[rid].n}：「${pleaText}」<br><br>`
               + `<span style="color:var(--gold)">这套说法站得住吗？<b>找一个绕不过去的角度，现在问。</b></span>`;
        S.noteKind = "hit";
      } else {
        S.note = `<b>▍「${nt}」摆上去了。</b>${SUSPECTS[rid].n}：「${pleaText}」<br><br>`
               + `<span style="color:var(--fg3)">答得挺顺——这张东西打不到。换个方向。</span>`;
        S.noteKind = "miss";
      }
    }
  }

  render();
}

/* ============ 分幕引擎 ============
   推进条件：在当前幕，对关键对象、就关键证据，追问出含"要害词"的问题
   落空两次进入渐进提示：第 1 次给方向，第 2 次给原话，第 3 次直接放过 */
function curStage(){
  if(!STAGES || S.stage<0 || S.stage>=STAGES.length) return null;
  return STAGES[S.stage];
}

/* 判定这次追问是否抓到了本幕的要害 */
function checkStageHit(rid, q){
  const st = curStage();
  if(!st || !st.task) return null;
  const task = st.task;
  if(rid !== task.rid) return null;
  // 必须先摊出指定证据，他才会正面接这句话
  if(!(S.opened[rid]||[]).includes(task.clue)) return null;
  const t = String(q||"");
  const hit = task.words.some(w=>t.includes(w));
  return { hit, task, st };
}

/* 过幕 */
function passStage(){
  const st = curStage();
  if(!st) return;
  if(!S.stageDone.includes(S.stage)) S.stageDone.push(S.stage);
  // 解锁新线索
  (st.task.give||[]).forEach(k=>{
    if(!S.unlockedClues.includes(k)) S.unlockedClues.push(k);
  });
  const gotNames = (st.task.give||[]).map(k=>CLUES[k].t);
  const next = S.stage + 1;
  if(next >= STAGES.length){
    // 四幕走完，进入收网
    S.stage = STAGES.length;
    S.stageTask = null;
    S.stageBanner = `<div class="stage-banner final">
        <div class="sb-n">${esc(st.n)} · 完成</div>
        <div class="sb-b">${esc(st.onPass)} 手上的证据够了——<b>指认吧。</b></div>
      </div>`;
    S.note = "";
    setStep(3);
    return;
  }
  S.stage = next;
  const ns = STAGES[next];
  // 新一幕的线索加入
  (ns.clues||[]).forEach(k=>{
    if(!S.unlockedClues.includes(k)) S.unlockedClues.push(k);
  });
  S.stageMiss = 0; S.hintLevel = 0;
  S.stageBanner = `<div class="stage-banner">
      <div class="sb-n">${esc(ns.n)}</div>
      <div class="sb-b">${st.onPass}${gotNames.length?` 桌上多了<b>${gotNames.join("、")}</b>。`:""}<br>${esc(ns.brief)}</div>
    </div>`;
  S.note = "";
  S.noteKind = "";
  render();
}

/* 渐进提示（分幕案件）：同样很晚才给，且不自动通关 */

}
